<main class="elemenx-column single-root">
	<h1 class="single-title">Single file</h1>
	<img class="single-logo" src="logo.svg" alt="Logo" />
	<Button Label="Count" Icon="add" Variant="primary" (click)="Clicked" />
	<span class="single-clicks">{{Clicks}}</span>
	<Icon Name="brands:github" Size="24" Colored="true" />
	<Button Label="Start the worker" Icon="play" (click)="StartWorker" />
	<span class="single-worker">{{Worker}}</span>
	<a class="single-about" href="/about">About</a>
	<div *outlet="Content"></div>
</main>

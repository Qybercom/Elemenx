# The checks of npm test, split into parallel jobs: lint, the browser contracts, the tooling, the minified build and
# the end-to-end tests. The tests run in the Google Chrome of the runner image (channel chrome): no browser download.
#
# A push runs the fast checks (a few minutes). The end-to-end tests run on a pull request, by hand (Run workflow), every
# night when main has new commits, and before every release (publish.yml calls this workflow with e2e). They are split
# by test between three jobs of two workers each. A change of the documentation alone runs nothing.
#
# The extensions of the editors, each in a job of its own, in parallel: every push checks that the Gradle of the plugin
# of IntelliJ starts (a few seconds); a push or a pull request that changes editors/ builds the extensions (VS Code and
# IntelliJ on Linux, Visual Studio on Windows), the plugin against an IntelliJ IDEA that Gradle downloads once: its
# cache, written by the builds of main, serves the next ones and the releases.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      e2e:
        description: Run the end-to-end tests too
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, contracts, dist
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install the color emoji font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - run: npm ci
      - run: npm run lint
      - run: npm run test:browser
      - run: npm run dist
      - name: Browser contracts against dist/elemenx.min.js
        run: npm run test:min
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 14

  tools:
    name: Tooling, Node ${{ matrix.node }} on ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:tools

  editors:
    name: Editor ${{ matrix.editor }}
    # Not for a release (publish.yml calls with e2e): its jobs of the editors build them, after npm, which they never hold back.
    # Each extension in a job of its own, in parallel: VS Code and the plugin of IntelliJ on Linux, Visual Studio on Windows.
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !inputs.e2e
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - editor: vscode
            os: ubuntu-latest
          - editor: intellij
            os: ubuntu-latest
          - editor: visualstudio
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        if: matrix.editor == 'intellij'
        with:
          distribution: temurin
          java-version: 21
      # The cache of Gradle and of the IntelliJ IDEA it downloads: written by main, read by the other branches and the tags.
      - uses: gradle/actions/setup-gradle@v5
        if: matrix.editor == 'intellij'
      # As editors/build.js starts it on Linux: through sh, whatever mode the checkout gave it.
      - name: The Gradle of the plugin of IntelliJ starts
        if: matrix.editor == 'intellij'
        run: sh editors/intellij/gradlew --version --project-dir editors/intellij
      - name: What the commits change in editors/
        id: changed
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "editors=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -q '^editors/'; then
            echo "editors=true" >> "$GITHUB_OUTPUT"
          else
            echo "editors=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.changed.outputs.editors == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.editors == 'true'
        run: npm ci
      # dist without the extensions, for the check of the versions; then the one extension of the job, against the IntelliJ IDEA of Gradle.
      - name: The extension
        if: steps.changed.outputs.editors == 'true'
        env:
          ELEMENX_INTELLIJ: download
        run: |
          npm run dist -- --no-editors
          node editors/build.js --only ${{ matrix.editor }}
          npm run version:built
      - uses: actions/upload-artifact@v5
        if: steps.changed.outputs.editors == 'true'
        with:
          name: editor-${{ matrix.editor }}
          path: dist/editors/
          retention-days: 14

  recent:
    name: New commits for the nightly run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.log.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 100
      - id: log
        run: |
          if [ -n "$(git log --since='25 hours ago' --format=%H -n 1)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: End-to-end ${{ matrix.shard }}/3
    needs: recent
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.recent.outputs.changed == 'true' || inputs.e2e) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install the color emoji font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - run: npm ci
      - run: npm run dist
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

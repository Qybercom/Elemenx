# The checks of npm test, split into parallel jobs: lint, the browser contracts, the tooling, the minified build and
# the end-to-end tests. The tests run in the Google Chrome of the runner image (channel chrome): no browser download.
#
# A push runs the fast checks (a few minutes). The end-to-end tests run on a pull request, by hand (Run workflow), every
# night when main has new commits, and before every release (publish.yml runs the whole npm test). A change of the
# documentation alone runs nothing.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, contracts, dist
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install the color emoji font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - run: npm ci
      - run: npm run lint
      - run: npm run test:browser
      - run: npm run dist
      - name: Browser contracts against dist/elemenx.min.js
        run: npm run test:min
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 14

  tools:
    name: Tooling, Node ${{ matrix.node }} on ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:tools

  recent:
    name: New commits for the nightly run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.log.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 100
      - id: log
        run: |
          if [ -n "$(git log --since='25 hours ago' --format=%H -n 1)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: End-to-end ${{ matrix.shard }}/3
    needs: recent
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.recent.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install the color emoji font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - run: npm ci
      - run: npm run dist
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

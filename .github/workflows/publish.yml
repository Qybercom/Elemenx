# Publishes @qybercom/elemenx and its short name elemenx (packages/elemenx) to npm when a version tag (v0.9.1) is
# pushed. First the tag must be the version of both packages; then the whole CI (ci.yml, the end-to-end tests
# included, in parallel jobs) must pass; then npm publish, whose prepack builds dist. It signs in with npm trusted
# publishing (OpenID Connect, no token): on npmjs.com, the settings of each package name this repository, this
# workflow file and the environment npm as its trusted publisher, with npm publish allowed. A version with a
# prerelease part (0.9.1-beta.1) goes to the dist-tag next, not latest. Last, in a job of its own, it creates the
# GitHub release of the tag, with notes made of the changes since the last release and the files of dist attached:
# every script, manifest.json, the extensions of the editors, and all of dist in one zip. The extensions need an
# IntelliJ IDEA that Gradle downloads (its cache comes from the builds of main in ci.yml): a failure there leaves npm
# published, and Re-run failed jobs makes the release alone.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    name: The tag is the version of both packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          version="$(node -p "require('./package.json').version")"
          wrapper="$(node -p "require('./packages/elemenx/package.json').version")"
          dependency="$(node -p "require('./packages/elemenx/package.json').dependencies['@qybercom/elemenx']")"
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$wrapper" != "$version" ] || [ "$dependency" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version of package.json, or packages/elemenx has the version $wrapper and depends on $dependency (npm run version:set puts the version everywhere)" >&2
            exit 1
          fi

  test:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true

  publish:
    name: npm
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci
      # Every step skips what is done already, so Re-run failed jobs finishes a release that stopped halfway.
      - name: Publish @qybercom/elemenx, then elemenx that depends on it
        run: |
          version="$(node -p "require('./package.json').version")"
          tag=latest
          case "$version" in
            *-*) tag=next ;;
          esac
          if [ -n "$(npm view "@qybercom/elemenx@$version" version 2>/dev/null)" ]; then
            echo "@qybercom/elemenx@$version is published already"
          else
            npm publish --access public --tag "$tag"
          fi
          if [ -n "$(npm view "elemenx@$version" version 2>/dev/null)" ]; then
            echo "elemenx@$version is published already"
          else
            (cd packages/elemenx && npm publish --tag "$tag")
          fi

  release:
    name: GitHub release with the editors
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # dist builds the extensions of the editors: the plugin of IntelliJ against an IntelliJ IDEA that Gradle downloads.
    # The marketplaces take them when their secrets are set (docs/EDITORS.md): a step without its secret is skipped.
    env:
      ELEMENX_INTELLIJ: download
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
      JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The Gradle and the IntelliJ IDEA of the builds of main: read here, not written (a tag is no default branch).
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - name: GitHub release with the files of dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already"
            exit 0
          fi
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac
          npm run dist
          # Every file of the release of the version of the tag: the scripts, manifest.json, the extensions.
          npm run version:built
          (cd dist && zip -qr "../elemenx-$version.zip" .)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Elemenx $version" --generate-notes $prerelease dist/*.js dist/manifest.json dist/editors/* "elemenx-$version.zip"
      # The extensions in the marketplaces, with the version of Elemenx; a prerelease as a pre-release (VS Code) or in the
      # channel beta (JetBrains). A version there already is skipped, so Re-run failed jobs goes on from the step that failed.
      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          [ -f dist/editors/elemenx-vscode.vsix ] || npm run dist
          case "$(node -p "require('./package.json').version")" in
            *-*) pre=--pre-release ;;
            *) pre= ;;
          esac
          npx --yes @vscode/vsce@4.0.0 publish --packagePath dist/editors/elemenx-vscode.vsix --skip-duplicate $pre -p "$VSCE_PAT"
      - name: Open VSX (VSCodium, Cursor, Windsurf)
        if: env.OVSX_PAT != ''
        run: |
          [ -f dist/editors/elemenx-vscode.vsix ] || npm run dist
          case "$(node -p "require('./package.json').version")" in
            *-*) pre=--pre-release ;;
            *) pre= ;;
          esac
          npx --yes ovsx@0.10.1 publish dist/editors/elemenx-vscode.vsix --skip-duplicate $pre -p "$OVSX_PAT"
      - name: JetBrains Marketplace
        if: env.JETBRAINS_TOKEN != ''
        run: |
          channel=default
          case "$(node -p "require('./package.json').version")" in
            *-*) channel=beta ;;
          esac
          sh editors/intellij/gradlew --project-dir editors/intellij publishPlugin --no-daemon -PpluginChannel="$channel"

  visualstudio:
    name: Visual Studio
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    # The extension of Visual Studio 2022: built with the MSBuild of the Visual Studio of the runner, attached to the
    # release, and published to the Visual Studio Marketplace with the token of VS Code (the same publisher) when it is set.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The extension of Visual Studio
        run: |
          npm run dist -- --no-editors
          node editors/build.js --visualstudio --no-intellij
      - name: Of the version of the tag
        run: npm run version:built
      - name: Attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" dist/editors/elemenx-visualstudio.vsix --clobber
      - name: Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: |
          $publisher = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.vssdk.buildtools" -Recurse -Filter VsixPublisher.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          & $publisher.FullName publish -payload dist\editors\elemenx-visualstudio.vsix -publishManifest editors\visualstudio\publishManifest.json -personalAccessToken $env:VSCE_PAT -ignoreWarnings "VSIXValidatorWarning01,VSIXValidatorWarning02"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# Publishes the package to npm when a version tag (v0.9.1) is pushed: the full npm test first, then npm publish, whose
# prepack builds dist. It signs in with npm trusted publishing (OpenID Connect, no token): on npmjs.com, the settings
# of the package name this repository and this workflow file as its trusted publisher. A version with a prerelease
# part (0.9.1-beta.1) goes to the dist-tag next, not latest.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1
      - name: The tag is the version of package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version of package.json" >&2
            exit 1
          fi
      - name: Install the color emoji font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - run: npm ci
      - run: npm test
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac

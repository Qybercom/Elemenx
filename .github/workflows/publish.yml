# Publishes @qybercom/elemenx and its short name elemenx (packages/elemenx) to npm when a version tag (v0.9.1) is
# pushed. First the tag must be the version of both packages; then the whole CI (ci.yml, the end-to-end tests
# included, in parallel jobs) must pass; then npm publish, whose prepack builds dist. It signs in with npm trusted
# publishing (OpenID Connect, no token): on npmjs.com, the settings of each package name this repository, this
# workflow file and the environment npm as its trusted publisher, with npm publish allowed. A version with a
# prerelease part (0.9.1-beta.1) goes to the dist-tag next, not latest. Last it creates the GitHub release of the
# tag, with notes made of the changes since the last release and the files of dist attached: every script,
# manifest.json, and all of dist in one zip.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    name: The tag is the version of both packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          version="$(node -p "require('./package.json').version")"
          wrapper="$(node -p "require('./packages/elemenx/package.json').version")"
          dependency="$(node -p "require('./packages/elemenx/package.json').dependencies['@qybercom/elemenx']")"
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$wrapper" != "$version" ] || [ "$dependency" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version of package.json, or packages/elemenx has the version $wrapper and depends on $dependency (npm run version:set puts the version everywhere)" >&2
            exit 1
          fi

  test:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      e2e: true

  publish:
    name: npm and GitHub release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci
      # Every step skips what is done already, so Re-run failed jobs finishes a release that stopped halfway.
      - name: Publish @qybercom/elemenx, then elemenx that depends on it
        run: |
          version="$(node -p "require('./package.json').version")"
          tag=latest
          case "$version" in
            *-*) tag=next ;;
          esac
          if [ -n "$(npm view "@qybercom/elemenx@$version" version 2>/dev/null)" ]; then
            echo "@qybercom/elemenx@$version is published already"
          else
            npm publish --access public --tag "$tag"
          fi
          if [ -n "$(npm view "elemenx@$version" version 2>/dev/null)" ]; then
            echo "elemenx@$version is published already"
          else
            (cd packages/elemenx && npm publish --tag "$tag")
          fi
      - name: GitHub release with the files of dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already"
            exit 0
          fi
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac
          [ -f dist/manifest.json ] || npm run dist
          (cd dist && zip -qr "../elemenx-$version.zip" .)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Elemenx $version" --generate-notes $prerelease dist/*.js dist/manifest.json "elemenx-$version.zip"

<div class="docs-page">
	<aside class="docs-nav" *resizable="{Edges: 'right', MinWidth: 200, MaxWidth: 560}" [style.width]="NavWidth ? NavWidth + 'px' : null" (resizeend)="NavResized">
		<div class="docs-nav-scroll"><NavList [label]="$T('docs.contents')" [items]="NavItems(Index, Lang())" [value]="Current($Params)" [expanded]="Expanded(Index, Current($Params))" (select)="Picked" /></div>
	</aside>
	<article class="docs-article" [attribute.lang]="Lang()">
		<i class="docs-sync" hidden *mount="Load(Current($Params), Lang())"></i>
		<div class="elemenx-callout neutral docs-fallback" *if="Fallback">{{$T('docs.untranslated')}}</div>
		<div class="docs-missing" *if="Missing">{{$T('docs.missing')}}</div>
		<div class="docs-segment" *for="segment of Segments" *key="segment.Key">
			<Markdown *if="segment.Kind === 'text'" Look="interface" [value]="segment.Text" />
			<section class="elemenx-card docs-tutorial" *if="segment.Key === 'text-0' && Tutorial(Current($Params), Tutorials)" [attribute.aria-label]="$T('docs.tutorial.title')">
				<div class="docs-tutorial-head">
					<div class="docs-tutorial-text">
						<strong>{{$T('docs.tutorial.title')}}</strong>
						<span class="elemenx-caption">{{Tutorial(Current($Params), Tutorials).Demo ? $T('docs.tutorial.text') : $T('docs.tutorial.server')}}</span>
					</div>
					<div class="docs-tutorial-actions">
						<a class="elemenx-button secondary medium docs-tutorial-download" [attribute.href]="'/tutorials/' + Tutorial(Current($Params), Tutorials).Project + '.zip'" [attribute.download]="Tutorial(Current($Params), Tutorials).Project + '.zip'"><Icon Name="download" /><span class="elemenx-button-label">{{$T('docs.tutorial.download')}}</span></a>
						<Button *if="Tutorial(Current($Params), Tutorials).Demo" Icon="play" [variant]="DemoOpen ? 'secondary' : 'primary'" [pressed]="DemoOpen" [loading]="DemoBusy" [label]="DemoOpen ? $T('docs.tutorial.hide') : $T('docs.tutorial.demo')" (click)="DemoToggled" />
						<Button *if="DemoOpen && Demo" Variant="ghost" Icon="external" [label]="$T('docs.tutorial.tab')" (click)="DemoTab" />
					</div>
				</div>
				<p class="docs-tutorial-failed" role="alert" *if="DemoOpen && DemoFailed">{{$T('docs.tutorial.failed')}}</p>
				<iframe class="docs-tutorial-frame" *if="DemoOpen && Demo" [attribute.src]="Demo" [attribute.title]="$T('docs.tutorial.demo')"></iframe>
			</section>
			<CodeView *if="segment.Kind === 'code'" Fold="true" [language]="segment.Language" [value]="segment.Code" />
			<DocsExample *if="segment.Kind === 'example'" [code]="segment.Code" />
			<figure class="docs-diagram" *if="segment.Kind === 'diagram'" *mount="Diagram(segment.Code)"></figure>
		</div>
		<section class="docs-source" *if="Sources.length">
			<h2>{{$T('docs.source')}}</h2>
			<Tabs Size="small" [label]="$T('docs.source')" [tabs]="Sources" [value]="SourceShown(Sources, Source)" (change)="SourcePicked" />
			<CodeView Fold="true" Rows="30" [language]="SourceFile(Sources, Source).Language" [value]="SourceFile(Sources, Source).Text" [label]="SourceFile(Sources, Source).Label" />
		</section>
	</article>
	<nav class="docs-toc" *if="Headings.length > 1" [attribute.aria-label]="$T('docs.onPage')">
		<h2 class="elemenx-label docs-toc-title">{{$T('docs.onPage')}}</h2>
		<button type="button" class="docs-toc-item" *for="heading of Headings" *key="heading.ID" [class.sub]="heading.Level > 2" [class.active]="heading.ID === Active" [attribute.data-id]="heading.ID" (click)="Jumped">{{heading.Text}}</button>
	</nav>
</div>

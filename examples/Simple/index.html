<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">

	<title>Elemenx Simple Example</title>

	<style>
		body {
			font-family: sans-serif;
			max-width: 720px;
			margin: 40px auto;
			padding: 0 20px;
		}

		button {
			padding: 8px 14px;
		}
	</style>

	<script src="/elemenx.js"></script>
	<script>
		Elemenx.Component('SimpleApp', {
			TemplateID: 'simple-app',

			ElemenxOnCreate: function () {
				var component = this;

				this.Batch(function (state) {
					state.Title = 'Hello from Elemenx';
					state.Count = 0;
				});

				this.Ref('Increment').addEventListener('click', function () {
					component.Batch(function (state) {
						state.Count++;
					});
				});
			}
		});

		Elemenx.Application('SimpleExample', {
			Component: 'SimpleApp',
			Mount: '#app'
		});
	</script>
</head>
<body>
	<div id="app"></div>

	<template id="simple-app">
		<main>
			<h1>{{Title}}</h1>
			<p>Counter: <b>{{Count}}</b></p>
			<button data-ref="Increment">Increment</button>
		</main>
	</template>
</body>
</html>

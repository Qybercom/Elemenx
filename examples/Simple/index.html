<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<link rel="icon" href="data:," />

	<title>Elemenx Simple Example</title>

	<style>
		:root {
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			color-scheme: light;
			--background: #f5f6f8;
			--surface: #ffffff;
			--surface-soft: #f8f9fb;
			--text: #20242b;
			--muted: #747b86;
			--border: #dfe2e7;
			--accent: #343a46;
			--accent-text: #ffffff;
			--shadow: 0 18px 55px rgba(25, 30, 40, 0.08);
		}

		body[data-theme='dark'] {
			color-scheme: dark;
			--background: #15171b;
			--surface: #1d2025;
			--surface-soft: #24282e;
			--text: #eef0f3;
			--muted: #9da4ae;
			--border: #353a43;
			--accent: #eef0f3;
			--accent-text: #181a1e;
			--shadow: 0 18px 55px rgba(0, 0, 0, 0.22);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: var(--background);
			color: var(--text);
			transition: background 160ms ease, color 160ms ease;
		}

		#app {
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 32px 20px;
		}

		.simple-card {
			width: min(100%, 560px);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 18px;
			box-shadow: var(--shadow);
			overflow: hidden;
		}

		.simple-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			padding: 18px 20px;
			border-bottom: 1px solid var(--border);
		}

		.brand {
			font-weight: 700;
			letter-spacing: -0.02em;
		}

		.badge {
			color: var(--muted);
			font-size: 12px;
		}

		.simple-content {
			padding: 34px;
		}

		h1 {
			margin: 0 0 10px;
			font-size: clamp(28px, 6vw, 40px);
			letter-spacing: -0.04em;
		}

		.description {
			margin: 0 0 28px;
			color: var(--muted);
			line-height: 1.6;
		}

		.counter {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			padding: 18px;
			background: var(--surface-soft);
			border: 1px solid var(--border);
			border-radius: 12px;
		}

		.counter-label {
			color: var(--muted);
			font-size: 13px;
		}

		.counter-value {
			margin-top: 2px;
			font: 700 28px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
		}

		button {
			appearance: none;
			border: 1px solid var(--border);
			border-radius: 9px;
			padding: 10px 14px;
			background: var(--surface);
			color: var(--text);
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}

		button:hover {
			background: var(--surface-soft);
		}

		button.primary {
			border-color: var(--accent);
			background: var(--accent);
			color: var(--accent-text);
		}
	</style>

	<script src="/elemenx.js"></script>
	<script>
		Elemenx.Component('SimpleApp', {
			$TemplateID: 'simple-app',

			$OnCreate: function () {
				var component = this;
				var storage = this.$Storage.Local.Namespace('SimpleExample');
				var theme = storage.Get('Theme') || 'light';

				this.$Batch(function (state) {
					state.Title = 'Hello from Elemenx';
					state.Count = 0;
					state.Theme = theme === 'dark' ? 'Dark' : 'Light';
				});

				document.body.setAttribute('data-theme', theme);

				this.$Ref('Increment').addEventListener('click', function () {
					component.$Batch(function (state) {
						state.Count++;
					});
				});

				this.$Ref('Theme').addEventListener('click', function () {
					theme = theme === 'dark' ? 'light' : 'dark';

					document.body.setAttribute('data-theme', theme);

					storage.Set('Theme', theme);

					component.$Batch(function (state) {
						state.Theme = theme === 'dark' ? 'Dark' : 'Light';
					});
				});
			}
		});

		Elemenx.Application('SimpleExample', {
			$Component: 'SimpleApp',
			$Mount: '#app'
		});
	</script>
</head>
<body>
<div id="app"></div>

<template id="simple-app">
	<main class="simple-card">
		<header class="simple-header">
			<div>
				<div class="brand">Elemenx</div>
				<div class="badge">Simple example</div>
			</div>

			<button #Theme>{{Theme}} theme</button>
		</header>
		<section class="simple-content">
			<h1>{{Title}}</h1>

			<p class="description">
				A tiny reactive component with state, refs, events and persistent theme selection.
			</p>

			<div class="counter">
				<div>
					<div class="counter-label">Current counter</div>
					<div class="counter-value">{{Count}}</div>
				</div>

				<button class="primary" #Increment>Increment</button>
			</div>
		</section>
	</main>
</template>
</body>
</html>

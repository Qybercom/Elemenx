<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Elemenx Messaging child</title>
	<script src="../elemenx.js"></script>
</head>
<body>
	<p>Automatic opener Messaging ready.</p>
	<small id="status">waiting</small>
	<script>
		var messaging = Elemenx.Messaging(['advanced:child']);

		messaging.On('advanced:child', function (message) {
			document.getElementById('status').textContent = 'received: ' + message.Data;

			messaging.Send('advanced:child-reply', 'child received: ' + message.Data);
		});
	</script>
</body>
</html>

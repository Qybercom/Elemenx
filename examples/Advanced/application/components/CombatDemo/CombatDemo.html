<div class="scene-demo">
	<div class="scene-demo-row">
		<Select Label="Weapon" [options]="CombatWeapons" [value]="CombatWeapon" (change)="CombatWeaponChosen" />
		<Select Label="Crosshair" [options]="CombatCrosshairs" [value]="CombatCrosshair" (change)="CombatCrosshair = $event && $event.detail !== undefined ? $event.detail : $event" />
		<Select Label="Aim at" [options]="CombatTargets" [value]="CombatTarget" (change)="CombatAimed" />
		<Button Label="Fire" Icon="target" (click)="CombatFire" />
		<Button Label="Burst of five" Icon="zap" Variant="ghost" (click)="CombatBurst" />
		<Button Label="Squads fight" Icon="users" Variant="ghost" (click)="CombatSquads" />
		<Button Label="Mortar barrage" Icon="crosshair" Variant="ghost" (click)="CombatBarrage" />
		<Button Label="New targets" Icon="refresh" Variant="ghost" (click)="CombatReset" />
	</div>
	<div class="scene-demo-row">
		<span class="elemenx-caption">Magic:</span>
		<Button Label="Beam the hero" Icon="sparkles" (click)="CombatBeam" />
		<Button Label="Circle on the wall" Icon="circle" Variant="ghost" (click)="CombatCircle" />
		<Button Label="Circle on the ground" Icon="circle-dot" Variant="ghost" (click)="CombatGroundCircle" />
		<Button Label="Dispel" Icon="x" Variant="ghost" (click)="CombatDispel" />
		<Button Label="Break the crate" Icon="box" Variant="ghost" (click)="CombatBreak" />
		<Button Label="Crack the wall" Icon="zap" Variant="ghost" (click)="CombatCrack" />
	</div>
	<p class="elemenx-caption" aria-live="polite">{{CombatNote}}</p>
	<div class="scene-demo-scene">
		<Scene Setting="terrain" Labels="false" Person="shoulder" [crosshair]="CombatCrosshair" [quality]="SceneQuality === 'auto' ? '' : SceneQuality" (ready)="CombatReady" (hit)="CombatHit" (lock)="CombatLocked" (crack)="CombatCracked" (break)="CombatBroke">
			<VirtualGamepad slot="hud" Floating="true" Right="true" Buttons="a,rt" Label="Fight" (button)="CombatPad" />
			<div slot="hud" class="combat-slots">
				<div class="elemenx-game-hotbar" role="group" aria-label="Weapons">
					<GameSlot *for="weapon of CombatWeapons" *key="weapon.Value" Size="small" Draggable="false" [accept]="[]" [icon]="weapon.Icon" [label]="weapon.Label" [key]="weapon.Key" [active]="weapon.Value === CombatWeapon" (use)="CombatWeaponChosen(weapon.Value)" />
				</div>
				<div class="elemenx-game-hotbar" role="group" aria-label="Magic">
					<GameSlot *for="spell of CombatSpells" *key="spell.Value" Size="small" Draggable="false" [accept]="[]" [icon]="spell.Icon" [label]="spell.Label" [color]="spell.Color" (use)="CombatSpell(spell.Value)" />
				</div>
			</div>
			<SceneObject ID="range" Kind="ground" [world]="WorldOf('meadow')" />
			<SceneObject ID="noon" Kind="sun" Time="14" Latitude="45" />
			<GameCombat Bars="hurt" (death)="CombatDied" />
			<GameStrategy Team="blue" />
		</Scene>
	</div>
</div>

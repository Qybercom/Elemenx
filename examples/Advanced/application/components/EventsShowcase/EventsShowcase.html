<div class="card events-showcase">
	<h2 class="card-title">Events</h2>
	<p>Same-runtime synchronous events with declarative <code>$Events</code>, one <code>$OnEvent</code> dispatcher and persistent <code>event.Is()</code> Pipes.</p>
	<p>Received: <b>{{EventValue}}</b></p><p>Event count: <b>{{EventCount}}</b></p>
	<Button Variant="primary" Label="Emit local event" (click)="EmitEvent" />
	<Button Variant="secondary" Label="Emit telemetry event" (click)="EmitTelemetry" />

	<h3>Debouncer</h3>
	<p>Accepts a new value only after 3 consecutive equal samples. Further repeats of the accepted value stay silent.</p>
	<p>Accepted: <b>{{DebouncerValue}}</b></p>
	<Input [Value]="DebouncerSample" Label="A sample" (input)="DebouncerSample = $event" />
	<Button Variant="secondary" Label="Emit one Debouncer sample" (click)="EmitDebouncerSample" />
	<Button Variant="secondary" Label="Run A/B/B/B" (click)="EmitDebouncedSignal" />

	<h3>Filter</h3>
	<p>Collects a 5-sample window and emits the dominant value from that window.</p>
	<p>Filtered: <b>{{FilterValue}}</b></p>
	<Button Variant="secondary" Label="Run A/B/A/A/B" (click)="RunFilter" />

	<h3>Gate</h3>
	<p>Passes only when a true condition remains asserted for 300 ms. A false sample closes the gate and cancels the pending pass.</p>
	<p>Gate: <b>{{GateValue}}</b></p>
	<Button Variant="secondary" Label="Hold true for 300 ms" (click)="RunGatePass" />
	<Button Variant="secondary" Label="Cancel after 100 ms" (click)="RunGateCancel" />
</div>

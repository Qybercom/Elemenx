<div class="scene-demo">
	<div class="scene-demo-row">
		<Select Label="Lens" [options]="CinemaLenses" [value]="CinemaLens" (change)="CinemaLensChosen" />
		<Select Label="Rig" [options]="CinemaRigs" [value]="CinemaRig" (change)="CinemaRigChosen" />
		<Button Label="Cutscene" Icon="play" (click)="CinemaPlay" />
		<Button Label="Record the cutscene" Icon="video" Variant="ghost" [disabled]="CinemaRecording" (click)="CinemaRecord" />
	</div>
	<p class="elemenx-caption">{{CinemaNote}}</p>
	<div class="scene-demo-scene">
		<Scene Setting="terrain" Labels="false" [quality]="SceneQuality === 'auto' ? '' : SceneQuality" (ready)="CinemaReady" (arrive)="CinemaArrived" (cue)="CinemaCued">
			<SceneObject ID="meadow" Kind="ground" [world]="WorldOf('meadow')" />
			<SceneObject ID="evening" Kind="sun" Time="17.5" Latitude="45" />
			<div slot="screens" data-screen="cinema-panel" class="ui-kit-cinema-panel">
				<h3>Control panel</h3>
				<p>A live part of the page on a screen in the world: press it there.</p>
				<div class="scene-demo-row">
					<Button Label="Press me" Icon="star" (click)="CinemaPressed" />
					<span>Pressed: {{CinemaPresses}}</span>
				</div>
				<div class="scene-demo-row">
					<Toggle Label="Lamp" [checked]="CinemaLamp" (change)="CinemaLampToggled" />
					<Input Size="small" Placeholder="Type here" />
				</div>
			</div>
			<div slot="screens" data-screen="cinema-hud" class="ui-kit-cinema-hud">
				<div class="ui-kit-cinema-hud-title">&#9679; REC</div>
				<div class="ui-kit-cinema-hud-bar"><span [style.width]="CinemaPresses * 10 % 100 + 10 + '%'"></span></div>
			</div>
		</Scene>
	</div>
</div>

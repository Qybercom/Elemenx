<div class="scene-demo">
	<Ribbon class="ui-kit-place-ribbon" Label="Racing" [tab]="RaceTab" (tab)="RaceTab = $event.ID">
		<RibbonTab ID="drive" Title="Drive">
			<RibbonGroup Title="Car" Icon="map-pin" Keep="true">
				<Select Label="Car" Size="small" [options]="RaceCars" [value]="RaceCar" (change)="RaceCarChosen" />
				<Select Label="Camera" Size="small" [options]="PlacePersons" [value]="RacePerson" (change)="RacePerson = $event" />
				<Select Label="Track" Size="small" [options]="RaceTracks" [value]="RaceKind" (change)="RaceKindChosen" />
				<Button Label="New track" Icon="map-pin" Variant="ghost" Size="small" (click)="RaceNewTrack" />
				<Toggle Label="Doors" [checked]="RaceDoors" (change)="RaceDoorsOpened" />
				<Button [Label]="RaceAboard ? 'Get out' : 'Get in'" Icon="log-out" Variant="ghost" Size="small" [title]="'The driver gets out of the car by its side, the car going on as it was (it rolls on by itself), or into it again by it (G)'" (click)="RaceBoarded" />
				<Button Label="Drives graph" Icon="code" Variant="ghost" Size="small" [pressed]="RaceGraphOpen === 'vehicles/drives'" [title]="'What each moving part, lamp and pop of the car is driven to, as blocks: the wheel, the pedals, the wipers, the brake lights...'" (click)="RaceGraphOpened('vehicles/drives')" />
				<Button Label="Wheel graph" Icon="code" Variant="ghost" Size="small" [pressed]="RaceGraphOpen === 'vehicles/wheel'" [title]="'How each wheel turns, as blocks: its spin, its steering, its spring, its lean'" (click)="RaceGraphOpened('vehicles/wheel')" />
				<span>{{RaceSpeed}} km/h{{RaceGear ? ' · ' + RaceGear : ''}}{{RaceLapText ? ' · ' + RaceLapText : ''}}{{RaceWrong ? ' · wrong way' : ''}}</span>
			</RibbonGroup>
			<RibbonGroup Title="Weather" Icon="sliders">
				<Select Label="Weather" Size="small" [options]="SceneWeathers" [value]="SceneWeather" (change)="SceneWeatherChosen" />
				<Field Label="Time of day" Horizontal="true" Size="small"><Slider Label="Time of day" Size="small" ShowValue="end" Min="0" Max="24" Step="0.25" [format]="PlaceClock" [value]="RaceHour" (input)="RaceTimed" /></Field>
				<Toggle Label="Just washed" [checked]="RaceWashed" (change)="RaceWet('Washed', $event)" />
				<Field Label="Drops" Horizontal="true" Size="small"><Slider Label="Drops" Size="small" ShowValue="end" Min="0" Max="1" Step="0.05" [value]="RaceDrops" (input)="RaceWet('Drops', $event)" /></Field>
			</RibbonGroup>
		</RibbonTab>
		<RibbonTab ID="setup" Title="Setup">
			<RibbonGroup Title="Stopping" Icon="sliders">
				<Field Label="Brake" Horizontal="true" Size="small"><Slider Label="Brake" Size="small" ShowValue="end" Min="6" Max="60" Step="1" [value]="RaceTune.Brake" (input)="RaceTuned('Brake', $event)" /></Field>
				<Field Label="Coast" Horizontal="true" Size="small"><Slider Label="Coast" Size="small" ShowValue="end" Min="0" Max="8" Step="0.1" [value]="RaceTune.Coast" (input)="RaceTuned('Coast', $event)" /></Field>
				<Field Label="Grip" Horizontal="true" Size="small"><Slider Label="Grip" Size="small" ShowValue="end" Min="0.6" Max="2.4" Step="0.05" [value]="RaceTune.Grip" (input)="RaceTuned('Grip', $event)" /></Field>
				<Field Label="Downforce" Horizontal="true" Size="small"><Slider Label="Downforce" Size="small" ShowValue="end" Min="0" Max="2" Step="0.1" [value]="RaceTune.Downforce" (input)="RaceTuned('Downforce', $event)" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Going" Icon="sliders">
				<Field Label="Power" Horizontal="true" Size="small"><Slider Label="Power" Size="small" ShowValue="end" Min="200000" Max="1400000" Step="10000" [value]="RaceTune.Power" (input)="RaceTuned('Power', $event)" /></Field>
				<Field Label="Steering" Horizontal="true" Size="small"><Slider Label="Steering" Size="small" ShowValue="end" Min="4" Max="40" Step="1" [value]="RaceTune.Answer" (input)="RaceTuned('Answer', $event)" /></Field>
				<Field Label="Agility" Horizontal="true" Size="small"><Slider Label="Agility" Size="small" ShowValue="end" Min="1" Max="5" Step="0.1" [value]="RaceTune.Agility" (input)="RaceTuned('Agility', $event)" /></Field>
				<Field Label="Assist" Horizontal="true" Size="small"><Slider Label="Assist" Size="small" ShowValue="end" Min="0" Max="1" Step="0.05" [value]="RaceTune.Assist" (input)="RaceTuned('Assist', $event)" /></Field>
				<Field Label="Drift grip" Horizontal="true" Size="small"><Slider Label="Drift grip" Size="small" ShowValue="end" Min="0.15" Max="1" Step="0.01" [value]="RaceTune.Slide" (input)="RaceTuned('Slide', $event)" /></Field>
				<Field Label="Softness" Horizontal="true" Size="small"><Slider Label="Softness" Size="small" ShowValue="end" Min="0.4" Max="2" Step="0.1" [value]="RaceTune.Ride" (input)="RaceTuned('Ride', $event)" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Turning" Icon="sliders">
				<Field Label="50 km/h" Horizontal="true" Size="small"><Slider Label="Turn at 50 km/h" Size="small" ShowValue="end" Min="20" Max="120" Step="1" [value]="RaceTurnOf(0)" (input)="RaceTurned(0, $event)" /></Field>
				<Field Label="100 km/h" Horizontal="true" Size="small"><Slider Label="Turn at 100 km/h" Size="small" ShowValue="end" Min="20" Max="120" Step="1" [value]="RaceTurnOf(1)" (input)="RaceTurned(1, $event)" /></Field>
				<Field Label="200 km/h" Horizontal="true" Size="small"><Slider Label="Turn at 200 km/h" Size="small" ShowValue="end" Min="20" Max="120" Step="1" [value]="RaceTurnOf(2)" (input)="RaceTurned(2, $event)" /></Field>
				<Field Label="300 km/h" Horizontal="true" Size="small"><Slider Label="Turn at 300 km/h" Size="small" ShowValue="end" Min="20" Max="120" Step="1" [value]="RaceTurnOf(3)" (input)="RaceTurned(3, $event)" /></Field>
				<Field Label="Wheel, slow" Horizontal="true" Size="small"><Slider Label="Steering time at a walk" Size="small" ShowValue="end" Min="0.05" Max="1" Step="0.05" [value]="RaceBuildOf(0)" (input)="RaceBuilt(0, $event)" /></Field>
				<Field Label="Wheel, fast" Horizontal="true" Size="small"><Slider Label="Steering time at top speed" Size="small" ShowValue="end" Min="0.05" Max="1" Step="0.05" [value]="RaceBuildOf(1)" (input)="RaceBuilt(1, $event)" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Body" Icon="sliders">
				<Field Label="Windows" Horizontal="true" Size="small"><Slider Label="Windows" Size="small" ShowValue="end" Min="-0.4" Max="1" Step="0.05" [value]="RaceWindows" (input)="RaceWindowsMoved" /></Field>
			</RibbonGroup>
		</RibbonTab>
	</Ribbon>
	<div class="scene-demo-scene" *if="RaceGraphOpen">
		<DemoGraph [name]="RaceGraphOpen" (change)="RaceGraphChanged" />
	</div>
	<div class="scene-demo-scene">
		<Scene Team="blue" [quality]="SceneQuality === 'auto' ? '' : SceneQuality" [person]="RacePerson" [weather]="SceneWeather" Labels="false" (person)="RacePerson = $event" (ready)="RaceReady" (ground)="RaceGrounded" (context)="RaceContext"><DemoLoading slot="loading" Title="Racing" /><div slot="screens" data-screen="dash" class="race-dash"><GameDash For="car" Size="large" Label="Dash" /></div><VirtualGamepad slot="hud" Floating="true" Tilt="true" Buttons="a,b,lt,rt,rb" Label="Drive" /><GameHud slot="hud" Label="Race"><GameStats slot="top" Label="Race" [items]="[{ID: 'lap', Label: 'Lap', Value: RaceBoard.Lap}, {ID: 'time', Label: 'Time', Value: RaceBoard.Time}, {ID: 'best', Label: 'Best', Value: RaceBoard.Best}]" /><span slot="top" class="elemenx-badge danger" *if="RaceWrong">Wrong way</span><GameDash slot="bottom" Size="small" Label="Speed" /></GameHud><GameRace Road="track" [laps]="RaceLaps" Countdown="0" (lap)="RaceLapped" (wrong)="RaceWrong = $event.Wrong" /></Scene>
	</div>
</div>

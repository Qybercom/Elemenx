<div class="application-shell">
	<header class="application-header">
		<a class="brand" href="/">
			<span class="brand-mark">E</span>
			<span>
				<strong>Elemenx</strong>
				<small>Advanced example</small>
			</span>
		</a>

		<nav>
			<a href="/">Home</a>
			<a href="/authorized">Authorized</a>
			<a href="/redirect-protected">Redirect</a>
			<a href="/project/42?tab=activity#latest">Project</a>
		</nav>

		<div class="header-actions">
			<div class="status-list" aria-label="Demo access status">
				<div class="status-pill" #SessionStatus>
					<span class="status-icon" aria-hidden="true">●</span>
					<span>
						<small>Session</small>
						<strong #SessionStatusText>Guest</strong>
					</span>
				</div>
				<div class="status-pill" #AccessStatus>
					<span class="status-icon" aria-hidden="true">◆</span>
					<span>
						<small>Project</small>
						<strong #AccessStatusText>Denied</strong>
					</span>
				</div>
			</div>

			<button class="theme-switch" #Theme>{{Theme}} theme</button>
		</div>
	</header>

	<main class="application-main" *outlet="Content"></main>
	<div class="waiting-outlet" *outlet="Waiting"></div>

	<footer>Built with Elemenx · Router · Services · Guards · Storage</footer>
</div>

<div
	class="service-badge"
	[class]="BadgeClasses"
	[class.offline]="!online"
	[style]="BadgeStyle"
	[style.--service-opacity]="online ? 1 : 0.65"
	[property.title]="online ? 'Service online' : 'Service offline'"
	[attribute.aria-label]="name + (online ? ' online' : ' offline')">
	<div class="service-copy">
		<strong>{{name}}</strong>

		<div class="service-state" data-if="online">
			<span class="state-dot active"></span>
			<span>Online</span>
			<span class="protected-state" data-if="protected">Protected</span>
		</div>

		<div class="service-state" data-if="!online">
			<span class="state-dot"></span>
			<span>Offline</span>
		</div>
	</div>

	<button class="mini-button" (click)="Toggle">Toggle state</button>
</div>

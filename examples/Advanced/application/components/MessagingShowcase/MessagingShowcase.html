<div class="card messaging-showcase">
	<h2 class="card-title">Messaging</h2>
	<p>Declarative <code>$Messaging</code> and <code>$OnMessage</code> with custom IDs, channels, contexts and <code>Message.Is()</code>.</p>
	<MessagingIDReceiver></MessagingIDReceiver>
	<MessagingChannelsReceiver></MessagingChannelsReceiver>
	<MessagingContextReceiver></MessagingContextReceiver>
	<MessagingPipesReceiver></MessagingPipesReceiver>
	<p>
		<button class="button primary" (click)="SendIDMessage">Send to custom ID</button>
		<button class="button" (click)="SendFooMessage">Send foo</button>
		<button class="button" (click)="SendBarMessage">Send bar</button>
	</p>
	<p>
		<button class="button" (click)="RunMessageDebouncer">Message Debouncer A/A/A</button>
		<button class="button" (click)="RunMessageFilter">Message Filter A/B/A/A/B</button>
		<button class="button" (click)="RunMessageGate">Message Gate 300 ms</button>
	</p>
	<div class="messaging-window-showcase">
		<p><code>$Messaging.Window('.messaging-frame')</code> — iframe reply: <b>{{WindowMessage}}</b></p>
		<iframe class="messaging-frame" src="/data/messaging-frame.html" title="Messaging iframe" style="width:100%;height:72px;border:1px solid rgba(127,127,127,.25);border-radius:4px"></iframe>
		<p><button class="button" (click)="SendWindowMessage">Send through iframe Window</button></p>
	</div>
	<p>
		<button class="button" (click)="SendContextMessage">Send context channel</button>
		<button class="button" (click)="SendStorageMessage">Send context storage channel</button>
		<button class="button" (click)="SendLocalMessage">Send local channel</button>
		<button class="button" (click)="SendSharedIDMessage">Send shared ID</button>
	</p>
</div>

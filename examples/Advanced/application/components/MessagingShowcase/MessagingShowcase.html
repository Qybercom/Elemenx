<div class="card messaging-showcase">
	<h2 class="card-title">Messaging</h2>
	<p>Message channels, direct addressing, contexts and explicit handler attachment.</p>
	<p>Channels: <code>{{MessageChannels}}</code></p><p>Received: <b>{{MessageValue}}</b></p><p>Message count: <b>{{MessageCount}}</b></p>
	<p>Storage handler: <b>{{StorageHandler}}</b></p>
	<button class="button primary" (click)="SendContextMessage">Send context message</button>
	<button class="button" (click)="SendStorageMessage">Send storage message</button>
	<button class="button" (click)="SendDirectMessage">Send direct message</button>
	<button class="button" (click)="ToggleStorageHandler">{{StorageHandlerAction}} storage handler</button>
</div>

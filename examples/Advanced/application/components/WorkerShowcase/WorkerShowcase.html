<div class="card worker-showcase">
	<h2 class="card-title">Workers</h2>
	<p>Owner-aware WebWorker and ServiceWorker handles use the same Messaging fabric as the page.</p>

	<h3>WebWorker</h3>
	<p><b>Manual:</b> <code>{{ManualMeta}}</code> — {{ManualState}}</p>
	<p><b>Lazy:</b> <code>{{LazyMeta}}</code> — {{LazyState}}</p>
	<p><b>Auto:</b> <code>{{AutoMeta}}</code> — {{AutoState}}</p>
	<p>Lifecycle: <b>{{WebLifecycle}}</b></p>
	<p>Reply: <b>{{WebReply}}</b></p>
	<Button Variant="secondary" Label="Start manual" (click)="StartManual" />
	<Button Variant="secondary" Label="Stop manual" (click)="StopManual" />
	<Button Variant="secondary" Label="Restart manual" (click)="RestartManual" />
	<Button Variant="secondary" Label="Destroy manual" (click)="DestroyManual" />
	<Button Variant="secondary" Label="Recreate all" (click)="CreateWebWorkers" />
	<Button Variant="primary" Label="Ping manual" (click)="PingManual" />
	<Button Variant="secondary" Label="Ping lazy" (click)="PingLazy" />
	<Button Variant="secondary" Label="Ping auto" (click)="PingAuto" />

	<h3>ServiceWorker</h3>
	<p>The demo uses the isolated <code>/elemenx-worker-showcase/</code> scope, so it does not take control of the Advanced page itself.</p>
	<p><b>Handle:</b> <code>{{ServiceMeta}}</code></p>
	<p><b>State:</b> {{ServiceState}} · <b>Registration:</b> {{ServiceRegistration}} · <b>Registered:</b> {{ServiceRegistered}} · <b>Controlled:</b> {{ServiceControlled}} · <b>Reachable:</b> {{ServiceReachable}}</p>
	<p>Lifecycle: <b>{{ServiceLifecycle}}</b></p>
	<p>Status check: <b>{{ServiceRefresh}}</b></p>
	<p>Reply: <b>{{ServiceReply}}</b></p>
	<Button Variant="primary" Label="Register" (click)="RegisterServiceWorker" />
	<Button Variant="secondary" Label="Refresh status" (click)="RefreshServiceWorkerStatus" />
	<Button Variant="secondary" Label="Update" (click)="UpdateServiceWorker" />
	<Button Variant="secondary" Label="Unregister" (click)="UnregisterServiceWorker" />
	<Button Variant="secondary" Label="Ping through Messaging" (click)="PingServiceWorker" />
</div>

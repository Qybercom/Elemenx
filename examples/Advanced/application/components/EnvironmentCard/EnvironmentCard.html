<section class="environment-card">
	<div class="environment-heading">
		<strong>{{name}}</strong>
		<span class="structure-label">loop #2 · component</span>
	</div>

	<div class="service-list" *if="HasServices">
		<ServiceBadge *for="service of services" *key="service.id" name="{{service.name}}" online="{{service.online}}" protected="{{service.protected}}" />
	</div>

	<p class="empty-state" *if="!HasServices">No services in this environment.</p>
</section>

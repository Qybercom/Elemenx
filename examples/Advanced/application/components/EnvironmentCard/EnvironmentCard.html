<section class="environment-card">
	<div class="environment-heading">
		<strong>{{name}}</strong>
		<span class="structure-label">loop #2 · component</span>
	</div>

	<div class="service-list" data-if="HasServices">
		<ServiceBadge data-for="service of services" data-key="service.id" name="{{service.name}}" online="{{service.online}}" protected="{{service.protected}}"></ServiceBadge>
	</div>

	<p class="empty-state" data-if="!HasServices">No services in this environment.</p>
</section>

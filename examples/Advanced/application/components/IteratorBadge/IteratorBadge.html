<div class="iterator-badge">
	<span class="iterator-index">#{{index + 1}}</span>
	<strong>{{item.name}}</strong>

	<span class="iterator-state" data-if="item.ready">
		Ready
		<span class="protected-state" data-if="item.protected">Protected</span>
	</span>

	<span class="iterator-state" data-if="!item.ready">Waiting</span>
</div>

<article class="project-card">
	<header class="project-card-heading">
		<div>
			<h3>{{name}}</h3>
			<p>{{description}}</p>
		</div>
		<span class="structure-label">loop #1</span>
	</header>

	<div class="environment-list">
		<EnvironmentCard *for="environment of environments" *key="environment.id" name="{{environment.name}}" services="{{environment.Services}}" />
	</div>
</article>

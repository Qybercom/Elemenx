<section>
	<div class="page-heading">
		<p class="eyebrow">Router showcase</p>
		<h1>Route leave guard</h1>
		<p class="lead">$OnRouteLeave can keep the current committed route active until leaving is allowed.</p>
	</div>
	<div class="card">
		<p><strong>{{LeaveStatus}}</strong></p>
		<p>Leave attempts: {{LeaveAttempts}}</p>
		<div class="button-row">
			<Button Variant="secondary" Label="Toggle leave permission" (click)="ToggleLeave" />
			<Button Variant="primary" Label="Go home programmatically" (click)="GoHome" />
		</div>
	</div>
</section>

<div class="scene-demo">
	<div class="scene-demo-row">
		<Select Label="Ship" [options]="OrbitShips" [value]="OrbitShip" (change)="OrbitShipChosen" />
		<Select Label="Warp to" [options]="OrbitPlaces" [value]="OrbitPlace" (change)="OrbitPlaced" />
		<Button Label="Warp (H)" Icon="send" Variant="ghost" (click)="OrbitTravel('warp')" />
		<Button Label="Jump (J)" Icon="chevrons-right" Variant="ghost" (click)="OrbitTravel('jump')" />
		<Select Label="Warp step" [options]="OrbitSteps" [value]="OrbitStep" (change)="OrbitStepChosen" />
		<Button Label="Warp blocker on Luna" Icon="lock" Variant="ghost" [pressed]="OrbitBlocked" [title]="'A blocker of warp (an anomaly of Luna): a warp to it comes out at the edge of its reach'" (click)="OrbitBlocker" />
		<span *if="OrbitPhase">{{OrbitPhase}}</span>
		<span *if="OrbitPassing">{{OrbitPassing}}</span>
		<span *if="OrbitAiming">{{OrbitAiming}}</span>
		<Button Label="Clouds graph" Icon="code" Variant="ghost" [pressed]="OrbitGraphOpen === 'shader/clouds'" [title]="'The clouds of a planet: its globe, their shadows, round the ship over its surface'" (click)="OrbitGraphOpened('shader/clouds')" />
		<Button Label="Forecast graph" Icon="code" Variant="ghost" [pressed]="OrbitGraphOpen === 'shader/forecast'" [title]="'The weather of a planet: its winds, storms, fronts, heaps, cirrus and rain; the rain over the ship comes of it'" (click)="OrbitGraphOpened('shader/forecast')" />
		<Button Label="Sky graph" Icon="code" Variant="ghost" [pressed]="OrbitGraphOpen === 'shader/cosmos'" [title]="'The sky far behind the system: gas, dust, the band of its galaxy as seen from where it lies, galaxies, stars'" (click)="OrbitGraphOpened('shader/cosmos')" />
		<Button Label="Planet graph" Icon="code" Variant="ghost" [pressed]="OrbitGraphOpen === 'shader/planet'" [title]="'The globe from far as blocks: its picture lit, its clouds and their shadows, its towns at night, its air at the edge'" (click)="OrbitGraphOpened('shader/planet')" />
		<Button Label="Ground graph" Icon="code" Variant="ghost" [pressed]="OrbitGraphOpen === 'shader/ground'" [title]="'The ground of the globe near and from over it as blocks: its picture, woods, fields, snow, dunes, relief, the tiles near, its light, water, towns at night, clouds and air'" (click)="OrbitGraphOpened('shader/ground')" />
		<Button Label="Far ground graph" Icon="code" Variant="ghost" [pressed]="OrbitGraphOpen === 'shader/ground-far'" [title]="'The picture of the ground of the globe from far as blocks: alpine meadow, rock on the steep, deserts, salt and marsh, snow, ice, the water by the coast, fields and houses, a river and a highway, as much of a texel as they cover'" (click)="OrbitGraphOpened('shader/ground-far')" />
		<Button Label="Forces graph" Icon="code" Variant="ghost" [pressed]="OrbitGraphOpen === 'aboard/forces'" [title]="'What is felt aboard as the ship flies (G: out of the seat): how much its artificial gravity takes away, how far a walker is carried and the view shaken by its speeding up, its turns, hits and warp'" (click)="OrbitGraphOpened('aboard/forces')" />
		<Button Label="Galaxy graph" Icon="code" Variant="ghost" [pressed]="OrbitGraphOpen === 'shader/galaxy'" [title]="'The arms of the galaxy the system lies in: the band across its sky follows them'" (click)="OrbitGraphOpened('shader/galaxy')" />
	</div>
	<div class="scene-demo-scene" *if="OrbitGraphOpen">
		<DemoGraph [name]="OrbitGraphOpen" (change)="OrbitGraphChanged" />
	</div>
	<div class="scene-demo-scene">
		<Scene [graphs]="OrbitGraphs" Scale="real" Team="blue" Speed="0.004" DaySeconds="600" Orbits="false" [quality]="SceneQuality === 'auto' ? '' : SceneQuality" [cosmos]="OrbitCosmos" (ready)="OrbitReady" (travel)="OrbitTravelled" (landing)="OrbitLanding"><DemoLoading slot="loading" Title="Orbit" />
			<VirtualGamepad slot="hud" Floating="true" Right="true" Buttons="a,b,x,y,rb,dpad" Label="Fly" />
			<GameTargets slot="hud" />
			<div slot="hud" class="scene-demo-tactics"><GameTactics /><GameRadar Shape="bubble" Size="220" Range="400" Zoomable="true" /></div>
			<GameHud slot="hud" Label="Flight"><GameFlight slot="bottom" Engineer="true" Size="small" /></GameHud>
			<div slot="screens" data-screen="console" class="scene-demo-console"><GameConsole /></div><div slot="screens" data-screen="console:pilot" class="scene-demo-console"><GameConsole Role="pilot" Radar="true" /></div><div slot="screens" data-screen="console:engineer" class="scene-demo-console"><GameConsole Role="engineer" /></div><div slot="screens" data-screen="console:gunner" class="scene-demo-console"><GameConsole Role="gunner" /></div>
		</Scene>
	</div>
</div>

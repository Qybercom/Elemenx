<div class="scene-demo">
	<Ribbon class="ui-kit-place-ribbon" Label="Location" [tab]="PlaceTab" (tab)="PlaceTab = $event.ID">
		<RibbonTab ID="place" Title="Place">
			<RibbonGroup Title="Where" Icon="map-pin" Keep="true">
				<Select Label="Location" Size="small" [options]="PlaceList" [value]="PlaceName" (change)="PlaceChosen" />
				<Select Label="Character" Size="small" [options]="PlaceCharacters" [value]="PlaceCharacter" (change)="PlaceCharacterChosen" />
				<Button Label="Walk here" Icon="map-pin" Variant="ghost" Size="small" (click)="PlaceLoad" />
				<Button Label="Parked ship" Icon="send" Variant="ghost" Size="small" [title]="'A ship standing beside the walker, its inside to walk in: up its ramp, G at a console sits there, G again stands up'" (click)="PlaceParked" />
			</RibbonGroup>
			<RibbonGroup Title="Camera" Icon="eye">
				<Select Label="Camera" Size="small" [options]="PlacePersons" [value]="PlacePerson" (change)="PlacePerson = $event" />
				<Toggle Label="Free look" [checked]="PlaceFree" (change)="PlaceFree = $event" />
				<Toggle Label="Cutaway" [checked]="PlaceCutaway" (change)="PlaceCutaway = $event" [title]="'Inside a ship: its hull and ceilings not drawn, the view from over it'" />
				<Button Label="Next camera (V)" Variant="ghost" Size="small" (click)="PlaceNextPerson" />
				<Field Label="Bokeh" Horizontal="true" Size="small"><Slider Label="Bokeh" Size="small" ShowValue="end" Min="0" Max="1" Step="0.05" [value]="SceneBokeh" (input)="SceneBokeh = $event" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Shoulder" Icon="eye">
				<Toggle Label="Left shoulder (B)" [checked]="PlaceShoulder === 'left'" (change)="PlaceShoulder = $event ? 'left' : 'right'" />
				<Toggle Label="Lamps" [checked]="PlaceLamps" (change)="PlaceLampsShown" />
				<Toggle Label="Body glow" [checked]="PlaceGlow" (change)="PlaceGlow = $event" />
				<Toggle Label="Mana bubbles" [checked]="PlaceMana" (change)="PlaceMana = $event" />
			</RibbonGroup>
			<RibbonGroup Title="Axes" Icon="move">
				<Toggle Label="Axes of the view" [checked]="PlaceAxes" (change)="PlaceAxes = $event" />
				<Toggle Label="Axes of the world" [checked]="PlaceOrigin" (change)="PlaceOrigin = $event" />
			</RibbonGroup>
		</RibbonTab>
		<RibbonTab ID="time" Title="Time">
			<RibbonGroup Title="Day" Icon="clock">
				<Field Label="Time of day" Horizontal="true" Size="small"><Slider Label="Time of day" Size="small" ShowValue="end" Min="0" [max]="PlaceSky.DayHours" Step="0.25" [format]="PlaceClock" [value]="PlaceHour" (input)="PlaceTimed" /></Field>
				<Field Label="Day length" Horizontal="true" Size="small"><Slider Label="Day length" Size="small" ShowValue="end" Min="6" Max="48" Step="1" Unit=" h" [value]="PlaceSky.DayHours" (input)="PlaceDayLength" /></Field>
				<Field Label="Day of year" Horizontal="true" Size="small"><Slider Label="Day of year" Size="small" ShowValue="end" Min="1" Max="365" [value]="PlaceSky.DayOfYear" (input)="PlaceDayChosen" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Planet" Icon="globe">
				<Field Label="Latitude" Horizontal="true" Size="small"><Slider Label="Latitude" Size="small" ShowValue="end" Min="-90" Max="90" Step="1" Unit="°" [value]="PlaceSky.Latitude" (input)="PlaceLatitudeChosen" /></Field>
				<Field Label="Axis tilt" Horizontal="true" Size="small"><Slider Label="Axis tilt" Size="small" ShowValue="end" Min="0" Max="60" Step="0.5" Unit="°" [value]="PlaceSky.Tilt" (input)="PlaceTiltChosen" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Night" Icon="moon">
				<Field Label="Night light" Horizontal="true" Size="small"><Slider Label="Night light" Size="small" ShowValue="end" Min="0" Max="3" Step="0.1" [value]="PlaceSky.NightLight" (input)="PlaceNightLight" /></Field>
				<Field Label="Town glow" Horizontal="true" Size="small"><Slider Label="Town glow" Size="small" ShowValue="end" Min="0" Max="1" Step="0.05" [value]="PlaceSky.SkyGlow" (input)="PlaceTownGlow" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Eclipses" Icon="sun">
				<Button Label="Of the sun" Variant="ghost" Size="small" (click)="PlaceEclipse('sun')" />
				<Button Label="Of the moon" Variant="ghost" Size="small" (click)="PlaceEclipse('moon')" />
			</RibbonGroup>
		</RibbonTab>
		<RibbonTab ID="moon" Title="Moon">
			<RibbonGroup Title="Moon" Icon="moon">
				<Toggle Label="Moon" [checked]="PlaceSky.Moon" (change)="PlaceMoonShown" />
				<Field Label="Moon light" Horizontal="true" Size="small"><Slider Label="Moon light" Size="small" ShowValue="end" Min="0" Max="3" Step="0.1" [value]="PlaceSky.MoonLight" (input)="PlaceMoonLight" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Disc" Icon="moon">
				<Field Label="Moon phase" Horizontal="true" Size="small"><Slider Label="Moon phase" Size="small" ShowValue="end" Min="0" Max="1" Step="0.01" [value]="PlaceSky.MoonPhase" (input)="PlaceMoonPhase" /></Field>
				<Field Label="Moon size" Horizontal="true" Size="small"><Slider Label="Moon size" Size="small" ShowValue="end" Min="0.3" Max="3" Step="0.1" [value]="PlaceSky.MoonSize" (input)="PlaceMoonSize" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Where it stands" Icon="compass">
				<Toggle Label="Hold the moon" [checked]="PlaceMoonHeld" (change)="PlaceMoonHold" />
				<Field Label="Moon height" Horizontal="true" Size="small"><Slider Label="Moon height" Size="small" ShowValue="end" Min="0" Max="90" Unit="°" [disabled]="!PlaceMoonHeld" [value]="PlaceMoonElevation" (input)="PlaceMoonHigh" /></Field>
				<Field Label="Moon azimuth" Horizontal="true" Size="small"><Slider Label="Moon azimuth" Size="small" ShowValue="end" Min="0" Max="360" Unit="°" [disabled]="!PlaceMoonHeld" [value]="PlaceMoonAzimuth" (input)="PlaceMoonRound" /></Field>
			</RibbonGroup>
		</RibbonTab>
		<RibbonTab ID="weather" Title="Weather">
			<RibbonGroup Title="Air" Icon="cloud">
				<Select Label="Weather" Size="small" [options]="SceneWeathers" [value]="SceneWeather" (change)="SceneWeatherChosen" />
				<Field Label="Wind" Horizontal="true" Size="small"><Slider Label="Wind" Size="small" ShowValue="end" Min="0" Max="4" Step="0.1" [value]="SceneWind" (input)="SceneWindChosen" /></Field>
			</RibbonGroup>
		</RibbonTab>
		<RibbonTab ID="effects" Title="Effects">
			<RibbonGroup Title="Burning" Icon="flame">
				<Button Label="Campfire" Variant="ghost" Size="small" (click)="PlaceEffect('campfire')" />
				<Button Label="Torch" Variant="ghost" Size="small" (click)="PlaceEffect('torch')" />
				<Button Label="Jet" Variant="ghost" Size="small" (click)="PlaceEffect('exhaust')" />
			</RibbonGroup>
			<RibbonGroup Title="Sudden" Icon="zap">
				<Button Label="Explosion" Variant="ghost" Size="small" (click)="PlaceEffect('explosion')" />
				<Button Label="Sparks" Variant="ghost" Size="small" (click)="PlaceEffect('spark')" />
				<Button Label="Smoke" Variant="ghost" Size="small" (click)="PlaceEffect('smoke')" />
			</RibbonGroup>
			<RibbonGroup Title="Colors" Icon="art:palette">
				<ColorInput Label="Fire color" Size="small" [value]="PlaceFire.Color" (input)="PlaceFireColor" />
				<ColorInput Label="Fire heart" Size="small" [value]="PlaceFire.Hot" (input)="PlaceFireHot" />
			</RibbonGroup>
			<RibbonGroup Title="Shape" Icon="sliders">
				<Field Label="Volume" Horizontal="true" Size="small"><Slider Label="Volume" Size="small" ShowValue="end" Min="0.1" Max="10" Step="0.1" [value]="PlaceFire.Volume" (input)="PlaceFireVolume" /></Field>
				<Field Label="Intensity" Horizontal="true" Size="small"><Slider Label="Intensity" Size="small" ShowValue="end" Min="0" Max="5" Step="0.1" [value]="PlaceFire.Intensity" (input)="PlaceFireIntensity" /></Field>
				<Field Label="Length" Horizontal="true" Size="small"><Slider Label="Length" Size="small" ShowValue="end" Min="0.1" Max="10" Step="0.1" [value]="PlaceFire.Length" (input)="PlaceFireLength" /></Field>
				<Field Label="Width" Horizontal="true" Size="small"><Slider Label="Width" Size="small" ShowValue="end" Min="0.1" Max="10" Step="0.1" [value]="PlaceFire.Width" (input)="PlaceFireWidth" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Rest" Icon="delete">
				<Field Label="Smoke" Horizontal="true" Size="small"><Slider Label="Smoke" Size="small" ShowValue="end" Min="0" Max="5" Step="0.1" [value]="PlaceFire.Smoke" (input)="PlaceFireSmoke" /></Field>
				<Button Label="Clear effects" Variant="ghost" Size="small" (click)="PlaceEffectsGone" />
			</RibbonGroup>
		</RibbonTab>
		<RibbonTab ID="magic" Title="Magic">
			<RibbonGroup Title="Circles" Icon="star">
				<Button Label="Magic circle" Variant="ghost" Size="small" (click)="PlaceEffect('circle')" />
				<Button Label="Aura" Variant="ghost" Size="small" (click)="PlaceEffect('aura')" />
				<Button Label="Portal" Variant="ghost" Size="small" (click)="PlaceEffect('portal')" />
			</RibbonGroup>
			<RibbonGroup Title="Light" Icon="sun">
				<Button Label="Pillar of light" Variant="ghost" Size="small" (click)="PlaceEffect('pillar')" />
				<Button Label="Beam" Variant="ghost" Size="small" (click)="PlaceEffect('beam')" />
				<Button Label="Lightning" Variant="ghost" Size="small" (click)="PlaceEffect('lightning')" />
			</RibbonGroup>
			<RibbonGroup Title="Spells" Icon="zap">
				<Button Label="Fireball" Variant="ghost" Size="small" (click)="PlaceEffect('fireball')" />
				<Button Label="Teleport" Variant="ghost" Size="small" (click)="PlaceEffect('teleport')" />
				<Button Label="Shield" Variant="ghost" Size="small" (click)="PlaceEffect('shield')" />
			</RibbonGroup>
			<RibbonGroup Title="Nature" Icon="heart">
				<Button Label="Healing" Variant="ghost" Size="small" (click)="PlaceEffect('healing')" />
				<Button Label="Frost" Variant="ghost" Size="small" (click)="PlaceEffect('frost')" />
				<Button Label="Poison" Variant="ghost" Size="small" (click)="PlaceEffect('poison')" />
			</RibbonGroup>
			<RibbonGroup Title="Look" Icon="art:palette">
				<Toggle Label="Colors of my own" [checked]="PlaceSpellOwn" (change)="PlaceSpellOwn = $event" />
				<ColorInput Label="Spell color" Size="small" [value]="PlaceSpell.Color" (input)="PlaceSpellColor" />
				<ColorInput Label="Spell heart" Size="small" [value]="PlaceSpell.Hot" (input)="PlaceSpellHot" />
			</RibbonGroup>
			<RibbonGroup Title="Rings" Icon="sliders">
				<Field Label="Spin" Horizontal="true" Size="small"><Slider Label="Spin" Size="small" ShowValue="end" Min="-5" Max="5" Step="0.1" [value]="PlaceFire.Spin" (input)="PlaceFireSpin" /></Field>
			</RibbonGroup>
			<RibbonGroup Title="Over time" Icon="clock">
				<Select Label="Pulse" Size="small" [options]="PlacePulseList" [value]="PlacePulse" (change)="PlacePulseChosen" />
			</RibbonGroup>
		</RibbonTab>
		<RibbonTab ID="view" Title="View">
			<RibbonGroup Title="Picture" Icon="image">
				<Field Label="Lens flare" Horizontal="true" Size="small"><Slider Label="Lens flare" Size="small" ShowValue="end" Min="0" Max="2" Step="0.1" [value]="SceneFlare" (input)="SceneFlareChosen" /></Field>
			</RibbonGroup>
		</RibbonTab>
	</Ribbon>
	<div class="scene-demo-scene">
		<Scene Team="blue" [quality]="SceneQuality === 'auto' ? '' : SceneQuality" [weather]="SceneWeather" [wind]="SceneWind" [flare]="SceneFlare" [freelook]="PlaceFree" [cutaway]="PlaceCutaway" [person]="PlacePerson" [shoulder]="PlaceShoulder" [axes]="PlaceAxes ? 'top-right' : ''" [origin]="PlaceOrigin" [bokeh]="SceneBokeh" (person)="PlacePerson = $event" (shoulder)="PlaceShoulder = $event" (ready)="PlaceReady" (ground)="PlaceGrounded"><DemoLoading slot="loading" Title="Locations" /><VirtualGamepad slot="hud" Floating="true" Right="true" Buttons="a,rb,lb" Label="Walk" /><GameTargets slot="hud" /><GameStrategy Command="seat" /><div slot="hud" class="scene-demo-tactics"><GameTactics /><GameRadar Shape="bubble" Size="220" Range="240" Zoomable="true" /></div><div slot="screens" data-screen="console" class="scene-demo-console"><GameConsole /></div><div slot="screens" data-screen="console:pilot" class="scene-demo-console"><GameConsole Role="pilot" Radar="true" /></div><div slot="screens" data-screen="console:engineer" class="scene-demo-console"><GameConsole Role="engineer" /></div><div slot="screens" data-screen="console:gunner" class="scene-demo-console"><GameConsole Role="gunner" /></div><SceneObject *if="PlaceGlow" ID="hero-glow" Kind="effect" Type="glow" Follow="hero" Color="#7fd0ff" Intensity="1" Where="both" /><SceneObject *if="PlaceMana" ID="hero-mana" Kind="effect" Type="mana" Follow="hero" /></Scene>
	</div>
</div>

<div class="scene-demo">
	<div class="scene-demo-row">
		<Select Label="Kind" Size="small" [options]="GalaxyKinds" [value]="GalaxyKind" (change)="GalaxyKindChosen" />
		<Select Label="Seed" Size="small" [options]="GalaxySeeds" [value]="GalaxySeed" (change)="GalaxySeedChosen" />
		<div class="galaxy-demo-time"><Field Label="Time" Horizontal="true" Size="small"><Slider Label="Time" Size="small" ShowValue="end" Min="0" Max="500" Step="1" Unit=" Myr" [value]="GalaxyTime" (input)="GalaxyTime = $event" /></Field></div>
		<Button Size="small" Label="Centre" Icon="position-center" Variant="ghost" [Disabled]="!!GalaxyEntered" (click)="GalaxyCentre" />
		<Button Size="small" Label="Enter the system" Icon="arrow-right" [Disabled]="!GalaxyStar || !!GalaxyEntered" (click)="GalaxyEnter" />
		<Button Size="small" Label="Back to the galaxy" Icon="arrow-left" Variant="ghost" [Disabled]="!GalaxyEntered" (click)="GalaxyLeave" />
		<Button Size="small" Label="Galaxy graph" Icon="code" Variant="ghost" [pressed]="GalaxyGraphOpen === 'shader/galaxy'" [title]="'The arms of the galaxy: its picture, its stars, its knots and the band of it in the sky of a system alike'" (click)="GalaxyGraphOpened('shader/galaxy')" />
		<Button Size="small" Label="Sky graph" Icon="code" Variant="ghost" [pressed]="GalaxyGraphOpen === 'shader/cosmos'" [title]="'The sky of a system: its parts as blocks, the band of the galaxy as seen from where the system lies among them'" (click)="GalaxyGraphOpened('shader/cosmos')" />
	</div>
	<div class="scene-demo-scene" *if="GalaxyGraphOpen">
		<DemoGraph [name]="GalaxyGraphOpen" (change)="GalaxyGraphChanged" />
	</div>
	<p class="elemenx-caption" aria-live="polite">{{GalaxyNote}}</p>
	<div class="scene-demo-scene">
		<Scene *if="GalaxyFresh" [graphs]="GalaxyGraphs" Setting="galaxy" Speed="0.02" DaySeconds="30" Labels="false" [galaxy]="GalaxyOptions" [galaxyTime]="GalaxyTime" [quality]="SceneQuality === 'auto' ? '' : SceneQuality" (ready)="GalaxyReady" (galaxy)="GalaxyPicked" (enter)="GalaxyIn" (leave)="GalaxyOut"><DemoLoading slot="loading" Title="Galaxy" /></Scene>
	</div>
</div>

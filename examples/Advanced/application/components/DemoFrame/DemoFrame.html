<Workspace class="demo-frame">
	<WorkspaceToolbar slot="header" [label]="Title">
		<a class="demo-frame-home" href="/">Elemenx</a>
		<strong class="demo-frame-title">{{Title}}</strong>
		<span class="demo-frame-note">{{NoteOf(Current)}}</span>
		<Select Label="Quality" Size="small" class="demo-frame-quality" [options]="Qualities" [value]="Quality" (change)="QualityChosen" />
		<Button Icon="maximize" Label="Fullscreen" Variant="ghost" (click)="Full" />
		<Button Icon="chart" Label="FPS" Variant="ghost" [attribute.aria-pressed]="String(FPS)" (click)="Timed" />
		<a class="demo-frame-other" [href]="Other">{{OtherLabel}}</a>
	</WorkspaceToolbar>
	<WorkspaceToolWindow slot="tools" ID="demos" Title="Demos" Icon="list" Area="left" [open]="!Phone" Padded="true">
		<Select Label="Quality" Size="small" [options]="Qualities" [value]="Quality" (change)="QualityChosen" />
		<NavList class="demo-frame-list" Label="Demos" [items]="DemoItems(Demos)" [value]="Current" (select)="Picked" />
	</WorkspaceToolWindow>
	<div slot="left-stripe" class="demo-frame-corner">
		<Button Variant="ghost" Size="small" Icon="sliders" Title="Controls" [Pressed]="!!Tools" (click)="Tools = !Tools" />
		<Button Variant="ghost" Size="small" Icon="maximize" Title="Fullscreen" (click)="Full" />
		<Button Variant="ghost" Size="small" Icon="chart" Title="FPS" [Pressed]="!!FPS" (click)="Timed" />
	</div>
	<div slot="main" class="demo-frame-main" [class.tools]="Tools" #Main>
		<slot></slot>
		<div class="demo-frame-fps" *if="FPS">
			<FPSMeter />
			<div class="demo-frame-device" *if="DeviceLine">{{DeviceLine}}</div>
		</div>
	</div>
</Workspace>

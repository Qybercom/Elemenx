// The interface of an Elemenx Application as a module of an Android program (elemenx build --native android-library).
plugins {
	id 'com.android.library'
}

android {
	namespace '__PACKAGE__'
	compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35

	defaultConfig {
		minSdk rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
		consumerProguardFiles 'consumer-rules.pro'
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
}

dependencies {
	implementation 'androidx.webkit:webkit:__WEBKIT__'
	implementation 'androidx.annotation:annotation:1.8.1'
}

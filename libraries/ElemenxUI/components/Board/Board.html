<div class="elemenx-board-host">
	<div class="elemenx-board" tabindex="0" role="application" [attribute.aria-label]="$T('ui.board.label')" [class]="['grid-' + (Grid || 'dots')]" [style.background-size]="GridStyle(X, Y, Zoom, GridSize).Size" [style.background-position]="GridStyle(X, Y, Zoom, GridSize).Position" (wheel)="Wheeled" (pointerdown)="Pressed" (pointermove)="Moved" (pointerup)="Released" (pointercancel)="Released" (keydown)="Key" (keyup)="Key">
		<div class="elemenx-board-world" [style.transform]="World(X, Y, Zoom)">
			<div class="elemenx-board-content"><slot></slot></div>
		</div>
	</div>
	<div class="elemenx-board-controls" *if="Controls">
		<Button Variant="ghost" Icon="zoom-out" [title]="$T('ui.board.zoomOut')" (click)="ZoomOut" />
		<span class="elemenx-board-zoom"><Button Variant="ghost" [label]="Percent(Zoom)" [ariaLabel]="$T('ui.board.fit')" [title]="$T('ui.board.fit')" (click)="Fitted" /></span>
		<Button Variant="ghost" Icon="zoom-in" [title]="$T('ui.board.zoomIn')" (click)="ZoomIn" />
	</div>
</div>

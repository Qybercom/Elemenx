<article class="elemenx-card structured elemenx-post" [class]="[Layout || 'vertical', Variant || 'outlined', Href ? 'linked' : '']" [attribute.aria-label]="Title">
	<div class="elemenx-card-media">
		<img *if="Image" [src]="Image" alt="" loading="lazy" />
		<div class="elemenx-card-date" *if="DateBadge && DateBadge !== 'false' && Format().When(Date)" aria-hidden="true"><strong>{{Format().Day(Date).Day}}</strong><span>{{Format().Day(Date).Month}}</span></div>
		<span class="elemenx-badge accent elemenx-post-category" *if="Category">{{Category}}</span>
	</div>
	<div class="elemenx-card-content">
		<div class="elemenx-card-body">
			<span class="elemenx-badge accent elemenx-post-category" *if="Category && !Image">{{Category}}</span>
			<h3 class="elemenx-card-title">{{Title}}</h3>
			<p class="elemenx-card-text elemenx-post-excerpt" *if="Excerpt">{{Excerpt}}</p>
			<div class="elemenx-container wrappable elemenx-post-tags" *if="Tags && Tags.length"><span class="elemenx-chip" *for="tag of Tags" *key="tag">#{{tag}}</span></div>
			<slot></slot>
		</div>
		<div class="elemenx-card-footer">
			<span class="elemenx-person" *if="Author">
				<span class="elemenx-person-avatar" aria-hidden="true"><Avatar [name]="Author" [image]="Avatar" [size]="32" /></span>
				<span class="elemenx-person-text"><span class="elemenx-person-name">{{Author}}</span><span class="elemenx-card-meta"><time *if="Format().When(Date)" [attribute.datetime]="Format().When(Date).toISOString()">{{Format().Date(Date)}}</time><span *if="ReadTime">{{ReadLabel ? ReadTime + ' ' + ReadLabel : $T('ui.postCard.readTime', {count: ReadTime})}}</span></span></span>
			</span>
			<span class="elemenx-spacer"></span>
			<button class="elemenx-card-action" type="button" *if="Likes !== null" [class.on]="!!Liked" [attribute.aria-pressed]="String(!!Liked)" [attribute.aria-label]="(LikeLabel || $T('ui.postCard.like')) + ' (' + Likes + ')'" (click)="Like"><Icon Name="heart" /><span>{{Format().Count(Likes)}}</span></button>
			<button class="elemenx-card-action" type="button" *if="Comments !== null" [attribute.aria-label]="(CommentLabel || $T('ui.postCard.comment')) + ' (' + Comments + ')'" (click)="Comment"><Icon Name="comment" /><span>{{Format().Count(Comments)}}</span></button>
			<button class="elemenx-card-action" type="button" [attribute.aria-label]="(ShareLabel || $T('ui.postCard.share'))" (click)="Share"><Icon Name="share" /></button>
		</div>
	</div>
	<a class="elemenx-card-link" *if="Href" [href]="Href" [attribute.aria-label]="Title"></a>
</article>

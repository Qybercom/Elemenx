<div class="elemenx-notification-frame">
	<i hidden *mount="Sized(Items)"></i>
	<section class="elemenx-notification-host" aria-live="polite" [class.page]="!!Page">
		<article class="elemenx-notification" role="status" tabindex="0" *for="item of Items" *key="item.ID" [class]="[item.Variant || '']" [attribute.data-id]="item.ID" (click)="Pressed">
			<img class="elemenx-notification-image" *if="item.Image" [attribute.src]="item.Image" alt="" />
			<span class="elemenx-notification-icon" *if="item.Icon && !item.Image"><Icon [name]="item.Icon" /></span>
			<div class="elemenx-notification-body">
				<strong class="elemenx-notification-title" *if="item.Title">{{item.Title}}</strong>
				<span class="elemenx-notification-text" *if="item.Text">{{item.Text}}</span>
				<div class="elemenx-notification-actions" *if="item.Actions && item.Actions.length">
					<button class="elemenx-button small" type="button" *for="action of item.Actions" *key="action.ID" [class]="[$index === 0 ? 'primary' : 'secondary']" [attribute.data-index]="$index" (click)="Acted">{{action.Label}}</button>
				</div>
			</div>
			<button class="elemenx-notification-close" type="button" [attribute.aria-label]="$T('ui.common.close')" (click)="Closed"><Icon Name="close" /></button>
		</article>
	</section>
</div>

<div class="elemenx-field" [class.horizontal]="Horizontal" [class.invalid]="!!Error" [class.disabled]="Disabled">
	<label class="elemenx-label elemenx-field-label" *if="Label" [class.required]="Required" (click)="Focus">{{Label}}</label>
	<div class="elemenx-field-body">
		<slot></slot>
		<span class="elemenx-field-error" role="alert" *if="Error">{{Error}}</span>
		<span class="elemenx-caption" *if="Hint && !Error">{{Hint}}</span>
	</div>
</div>

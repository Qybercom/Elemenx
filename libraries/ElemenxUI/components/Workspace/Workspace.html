<div class="elemenx-screen elemenx-workspace" [class.ribbon]="Variant === 'ribbon'">
	<div class="elemenx-container elemenx-workspace-header elemenx-layout-area"><slot name="header"></slot></div>
	<div class="elemenx-column elemenx-workspace-ribbon elemenx-layout-area"><slot name="ribbon"></slot></div>
	<div class="elemenx-container elemenx-workspace-band top elemenx-layout-area"><slot name="top-stripe"></slot></div>
	<div class="elemenx-container fill elemenx-workspace-body">
		<div class="elemenx-column elemenx-workspace-stripe left elemenx-layout-area"><slot name="left-stripe"></slot></div>
		<div class="elemenx-column elemenx-workspace-panel left elemenx-layout-area" data-panel="left" *resizable="{Edges: 'right', MinWidth: 160, MaxWidth: 640}" (resizeend)="Resized"><slot name="left"></slot></div>
		<div class="elemenx-column fill elemenx-workspace-center">
			<div class="elemenx-column fill elemenx-workspace-main"><slot name="main"></slot></div>
			<div class="elemenx-column elemenx-workspace-panel bottom elemenx-layout-area" data-panel="bottom" *resizable="{Edges: 'top', MinHeight: 80, MaxHeight: 640}" (resizeend)="Resized"><slot name="bottom"></slot></div>
		</div>
		<div class="elemenx-column elemenx-workspace-panel right elemenx-layout-area" data-panel="right" *resizable="{Edges: 'left', MinWidth: 160, MaxWidth: 640}" (resizeend)="Resized"><slot name="right"></slot></div>
		<div class="elemenx-column elemenx-workspace-stripe right elemenx-layout-area"><slot name="right-stripe"></slot></div>
	</div>
	<div class="elemenx-container elemenx-workspace-band bottom elemenx-layout-area"><slot name="bottom-stripe"></slot></div>
	<div class="elemenx-container elemenx-workspace-status elemenx-layout-area"><slot name="status"></slot></div>
</div>

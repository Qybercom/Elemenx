<article class="elemenx-chat-message" [class]="[Position || 'single', Own ? 'own' : '', Selecting ? 'selecting' : '', Selected ? 'selected' : '']" (contextmenu)="Context" (keydown)="Key" (pointerdown)="Down" (pointermove)="Moved" (pointerup)="Released" (pointercancel)="Released" (click)="Pressed">
	<button class="elemenx-chat-check" type="button" role="checkbox" *if="Selecting" [attribute.aria-checked]="String(!!Selected)" [attribute.aria-label]="$T('ui.chatMessage.select')" (click)="Checked"><Icon *if="Selected" Name="check" Size="14" /></button>
	<span class="elemenx-chat-avatar" aria-hidden="true">
		<img *if="Avatar && (Position === 'single' || Position === 'last')" [src]="Avatar" alt="" />
		<span *if="!Avatar && (Position === 'single' || Position === 'last')">{{Initials(Author)}}</span>
	</span>
	<div class="elemenx-chat-body elemenx-popup-anchor">
		<div class="elemenx-chat-line">
			<div class="elemenx-chat-bubble" [class.sticker]="!!Sticker">
				<span class="elemenx-chat-author" *if="Author && !Own && (Position === 'single' || Position === 'first')">{{Author}}</span>
				<img class="elemenx-chat-sticker" *if="Sticker" [src]="Sticker" [attribute.alt]="Text || $T('ui.chatMessage.sticker')" draggable="false" />
				<span class="elemenx-chat-text" *if="Text && !Sticker">{{Text}}</span>
				<slot></slot>
				<span class="elemenx-chat-meta" *if="Time || Status || Edited || ViewCount(Views, Viewers)">
					<span class="elemenx-chat-edited" *if="Edited" [attribute.title]="Edited === true ? null : Edited">{{$T('ui.chatMessage.edited')}}</span>
					<button class="elemenx-chat-views" type="button" *if="ViewCount(Views, Viewers)" [attribute.aria-label]="$T('ui.chatMessage.views', {count: ViewCount(Views, Viewers)})" (click)="OpenSummary"><Icon Name="eye" Size="12" /><span>{{ViewCount(Views, Viewers)}}</span></button>
					<time *if="Time">{{Time}}</time>
					<span class="elemenx-chat-status" *if="StatusIcon(Status)" [class]="[Status]"><Icon [name]="StatusIcon(Status)" Size="14" [label]="Status === 'sending' ? $T('ui.chatMessage.sending') : Status === 'sent' ? $T('ui.chatMessage.sent') : Status === 'delivered' ? $T('ui.chatMessage.delivered') : Status === 'read' ? $T('ui.chatMessage.read') : $T('ui.chatMessage.error')" /></span>
				</span>
			</div>
			<span class="elemenx-chat-tools">
				<button class="elemenx-chat-react" type="button" *if="React && React !== 'false'" [attribute.aria-label]="$T('ui.chatMessage.react')" [attribute.title]="$T('ui.chatMessage.react')" [attribute.aria-expanded]="String(Picking)" (click)="Pick"><Icon Name="reaction" /></button>
				<button class="elemenx-chat-more" type="button" *if="(Actions || []).length" [attribute.aria-label]="$T('ui.chatMessage.actions')" [attribute.title]="$T('ui.chatMessage.actions')" aria-haspopup="menu" [attribute.aria-expanded]="String(MenuOpen)" (click)="More"><Icon Name="more" /></button>
			</span>
		</div>
		<div class="elemenx-chat-reactions" *if="Reactions && Reactions.length">
			<button class="elemenx-chat-reaction" type="button" *for="reaction of Reactions" *key="reaction.Emoji" [class.mine]="!!reaction.Mine" [attribute.aria-pressed]="String(!!reaction.Mine)" [attribute.aria-label]="reaction.Emoji + ' ' + reaction.Count" [attribute.title]="Names(reaction.Users) || null" [attribute.data-emoji]="reaction.Emoji" (click)="Toggled"><span class="elemenx-chat-reaction-emoji">{{reaction.Emoji}}</span><span>{{reaction.Count}}</span></button>
		</div>
		<div class="elemenx-popup elemenx-chat-react-picker" data-placement="top-start" data-match-width="false" *popup="Picking" (dismiss)="Dismissed"><EmojiPicker *if="Picking" Columns="8" (pick)="Reacted" (dismiss)="Dismissed" /></div>
		<div class="elemenx-popup elemenx-chat-summary" role="dialog" [attribute.aria-label]="$T('ui.chatMessage.summary')" data-placement="top-start" data-match-width="false" *popup="Summary" (dismiss)="SummaryClosed">
			<div class="elemenx-chat-summary-tabs" role="tablist">
				<button class="elemenx-chat-summary-tab" type="button" role="tab" data-tab="all" *if="(Reactions || []).length" [class.active]="SummaryTab === 'all'" [attribute.aria-selected]="String(SummaryTab === 'all')" (click)="SummaryChosen">{{$T('ui.chatMessage.all')}} {{ReactionTotal(Reactions)}}</button>
				<button class="elemenx-chat-summary-tab" type="button" role="tab" *for="reaction of Reactions || []" *key="reaction.Emoji" [attribute.data-tab]="reaction.Emoji" [class.active]="SummaryTab === reaction.Emoji" [attribute.aria-selected]="String(SummaryTab === reaction.Emoji)" (click)="SummaryChosen">{{reaction.Emoji}} {{reaction.Count}}</button>
				<button class="elemenx-chat-summary-tab" type="button" role="tab" data-tab="views" *if="ViewCount(Views, Viewers)" [class.active]="SummaryTab === 'views'" [attribute.aria-selected]="String(SummaryTab === 'views')" (click)="SummaryChosen"><Icon Name="eye" Size="14" /> {{ViewCount(Views, Viewers)}}</button>
			</div>
			<ul class="elemenx-chat-summary-list">
				<li class="elemenx-chat-summary-row" *for="row of SummaryRows(Reactions, Viewers, SummaryTab)" *key="$index">
					<span class="elemenx-chat-summary-avatar" aria-hidden="true"><img *if="row.Avatar" [src]="row.Avatar" alt="" /><span *if="!row.Avatar">{{Initials(row.Name)}}</span></span>
					<span class="elemenx-chat-summary-name">{{row.Name}}</span>
					<span class="elemenx-chat-summary-note" *if="row.Emoji || row.Note">{{row.Emoji || row.Note}}</span>
				</li>
				<li class="elemenx-chat-summary-empty" *if="!SummaryRows(Reactions, Viewers, SummaryTab).length">{{SummaryTab === 'views' ? $T('ui.chatMessage.viewsUnknown', {count: ViewCount(Views, Viewers)}) : $T('ui.chatMessage.nobody')}}</li>
			</ul>
		</div>
	</div>
	<span class="elemenx-chat-menu-point elemenx-popup-anchor" [style.left]="MenuX + 'px'" [style.top]="MenuY + 'px'"><MenuList [items]="Actions || []" [open]="MenuOpen" Sheet="auto" [title]="Text || null" (select)="Chosen" (dismiss)="MenuClosed" /></span>
</article>

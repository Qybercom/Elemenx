<div class="elemenx-keyboard" role="group" [class]="[Size || 'medium', Clickable ? 'clickable' : '']" [attribute.aria-label]="Label || $T('ui.keyboard.label')">
	<div class="elemenx-keyboard-block" *for="block of Blocks(Layout)" *key="block.Name" [class]="[block.Name]" [attribute.style]="block.Style">
		<button class="elemenx-keyboard-key elemenx-focus-ring" type="button" *for="key of block.Keys" *key="key.Code" [class]="[Mark(key.Code, Marks), Down(key.Code, Pressed) ? 'pressed' : '']" [attribute.style]="key.Style" [attribute.data-code]="key.Code" [attribute.tabindex]="Clickable ? null : -1" [attribute.aria-pressed]="String(Down(key.Code, Pressed))" [attribute.aria-label]="(Name(key, Labels, Map) || key.Code) + (Second(key, Alternate, Map) ? ' ' + Second(key, Alternate, Map) : '')" [class.dual]="!!Second(key, Alternate, Map)" (click)="Press"><span class="elemenx-keyboard-label">{{Name(key, Labels, Map)}}</span><span class="elemenx-keyboard-second" *if="Second(key, Alternate, Map)" aria-hidden="true">{{Second(key, Alternate, Map)}}</span></button>
	</div>
</div>

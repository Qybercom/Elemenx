<div class="elemenx-title-bar-host">
	<header class="elemenx-title-bar elemenx-native-drag" [class.overlay]="Frame === 'hidden'" [class.controls]="Own(Controls, Frame)">
		<span class="elemenx-title-bar-icon" *if="Image || Icon"><img *if="Image" [src]="Image" alt="" /><Icon *if="!Image && Icon" [name]="Icon" /></span>
		<div class="elemenx-title-bar-content elemenx-native-nodrag"><slot></slot></div>
		<span class="elemenx-title-bar-title" *if="Title">{{Title}}</span>
		<span class="elemenx-title-bar-space" *if="!Title"></span>
		<div class="elemenx-title-bar-actions elemenx-native-nodrag"><slot name="actions"></slot></div>
		<div class="elemenx-title-bar-controls elemenx-native-nodrag" *if="Own(Controls, Frame)">
			<button class="elemenx-title-bar-control" type="button" [attribute.aria-label]="$T('ui.window.minimize')" [attribute.title]="$T('ui.window.minimize')" (click)="Minimize"><Icon Name="window-minimize" /></button>
			<button class="elemenx-title-bar-control" type="button" [attribute.aria-label]="Maximized ? $T('ui.window.restore') : $T('ui.window.maximize')" [attribute.title]="Maximized ? $T('ui.window.restore') : $T('ui.window.maximize')" (click)="Maximize"><Icon [name]="Maximized ? 'window-restore' : 'window-maximize'" /></button>
			<button class="elemenx-title-bar-control close" type="button" [attribute.aria-label]="$T('ui.window.close')" [attribute.title]="$T('ui.window.close')" (click)="Close"><Icon Name="close" /></button>
		</div>
	</header>
</div>

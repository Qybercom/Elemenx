<div class="elemenx-pagination" role="navigation" [attribute.aria-label]="(Label || $T('ui.pagination.label'))">
	<span class="elemenx-caption elemenx-pagination-range" *if="ShowRange">{{Range(Page, Count, PageSize)}}</span>
	<span class="elemenx-spacer"></span>
	<select class="elemenx-pagination-size" [attribute.aria-label]="$T('ui.pagination.rowsPerPage')" *if="PageSizes && PageSizes.length" (change)="Resize">
		<option *for="size of PageSizes" *key="size" [value]="size" [selected]="Number(size) === Number(PageSize)">{{SizeLabel ? size + ' ' + SizeLabel : $T('ui.pagination.size', {size: size})}}</option>
	</select>
	<button class="elemenx-pagination-page elemenx-bare elemenx-focus-ring" type="button" *if="ShowFirstLast" [attribute.aria-label]="$T('ui.pagination.first')" [disabled]="Current(Page, Count, PageSize) <= 1" (click)="First"><Icon Name="page-first" /></button>
	<button class="elemenx-pagination-page elemenx-bare elemenx-focus-ring" type="button" *if="ShowPrevNext" [attribute.aria-label]="$T('ui.pagination.previous')" [disabled]="Current(Page, Count, PageSize) <= 1" (click)="Previous"><Icon Name="chevron-left" /></button>
	<span class="elemenx-pagination-pages" *if="ShowPages">
		<span *for="item of List(Page, Count, PageSize, Siblings, Boundaries)" *key="item.Key">
			<span class="elemenx-pagination-gap" *if="item.Gap">…</span>
			<button class="elemenx-pagination-page elemenx-bare elemenx-focus-ring" type="button" *if="!item.Gap" [class.current]="item.Current" [attribute.aria-current]="item.Current ? 'page' : null" [attribute.data-page]="item.Number" (click)="To">{{item.Number}}</button>
		</span>
	</span>
	<button class="elemenx-pagination-page elemenx-bare elemenx-focus-ring" type="button" *if="ShowPrevNext" [attribute.aria-label]="$T('ui.pagination.next')" [disabled]="Current(Page, Count, PageSize) >= Pages(Count, PageSize)" (click)="Next"><Icon Name="chevron-right" /></button>
	<button class="elemenx-pagination-page elemenx-bare elemenx-focus-ring" type="button" *if="ShowFirstLast" [attribute.aria-label]="$T('ui.pagination.last')" [disabled]="Current(Page, Count, PageSize) >= Pages(Count, PageSize)" (click)="Last"><Icon Name="page-last" /></button>
</div>

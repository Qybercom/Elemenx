<div class="elemenx-input" [class]="[Size || 'medium', Shape === 'round' ? 'round' : '', Invalid || Rejected ? 'invalid' : '', Disabled ? 'disabled' : '', ReadOnly ? 'readonly' : '']">
	<Icon *if="Icon" [name]="Icon" />
	<span class="elemenx-input-affix" *if="Prefix">{{Prefix}}</span>
	<input class="elemenx-input-control" *if="!Mask" [type]="InputType(Type, Preset, Revealed)" [value]="Value" [placeholder]="Placeholder" [disabled]="Disabled" [attribute.readonly]="ReadOnly ? '' : null" [attribute.name]="Name" [attribute.autocomplete]="PresetAttribute(Preset, 'Autocomplete', Autocomplete)" [attribute.inputmode]="PresetAttribute(Preset, 'InputMode', InputMode)" [attribute.dir]="PresetAttribute(Preset, 'Direction', null)" [attribute.spellcheck]="Preset ? 'false' : null" [attribute.autocapitalize]="Preset ? 'off' : null" [attribute.maxlength]="MaxLength" [attribute.min]="Min" [attribute.max]="Max" [attribute.step]="Step" [attribute.aria-invalid]="Invalid || Rejected ? 'true' : null" (input)="Typed" (change)="Committed" />
	<input class="elemenx-input-control" *if="Mask" type="text" *mask="{Mask: Mask, Value: Value}" [placeholder]="Placeholder" [disabled]="Disabled" [attribute.readonly]="ReadOnly ? '' : null" [attribute.name]="Name" [attribute.autocomplete]="Autocomplete" [attribute.inputmode]="InputMode || 'numeric'" [attribute.aria-invalid]="Invalid ? 'true' : null" (mask)="Masked" (change)="Committed" />
	<span class="elemenx-input-affix" *if="Suffix">{{Suffix}}</span>
	<button class="elemenx-input-action" type="button" tabindex="-1" [attribute.aria-label]="$T('ui.common.clear')" *if="Clearable && Value && !Disabled && !ReadOnly" (click)="Clear"><Icon Name="close" /></button>
	<button class="elemenx-input-action" type="button" *if="Type === 'password'" [attribute.aria-label]="Revealed ? $T('ui.input.hidePassword') : $T('ui.input.showPassword')" [attribute.aria-pressed]="String(Revealed)" [attribute.aria-busy]="Asking ? 'true' : null" (click)="Reveal"><Icon [name]="Asking ? 'loader' : Revealed ? 'eye-off' : 'eye'" [spin]="!!Asking" /></button>
	<Icon *if="IconRight" [name]="IconRight" />
	<slot></slot>
</div>

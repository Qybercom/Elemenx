<section class="elemenx-column elemenx-terminal" [attribute.aria-label]="Title || $T('ui.terminal.title')" [class.busy]="Busy">
	<header class="elemenx-container elemenx-terminal-header">
		<Icon Name="terminal" />
		<span class="elemenx-terminal-title">{{Title}}</span>
		<span class="elemenx-terminal-actions"><slot name="actions"></slot></span>
	</header>
	<div class="elemenx-column fill elemenx-terminal-output" role="log" aria-live="polite" (scroll)="Scrolled" (click)="FocusLine">
		<div class="elemenx-terminal-line" *for="line of Lines" *key="line.ID == null ? $index : line.ID" [class]="[line.Kind || 'output']"><span class="elemenx-terminal-prompt" *if="line.Kind === 'input'">{{Prompt}}</span>{{line.Text}}</div>
	</div>
	<label class="elemenx-container elemenx-terminal-command">
		<span class="elemenx-terminal-prompt">{{Prompt}}</span>
		<input class="elemenx-terminal-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" [attribute.aria-label]="$T('ui.terminal.command')" [placeholder]="Placeholder" [attribute.readonly]="Busy ? '' : null" [attribute.aria-busy]="Busy ? 'true' : null" (keydown)="Key" />
		<Spinner *if="Busy" Size="small" [label]="$T('ui.terminal.running')" />
	</label>
</section>

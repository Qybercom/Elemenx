<div class="elemenx-facet-filter" role="group" [attribute.aria-label]="Label || $T('ui.media.filters')">
	<div class="elemenx-facet-filter-head">
		<strong class="elemenx-facet-filter-title">{{Label || $T('ui.media.filters')}}</strong>
		<button class="elemenx-facet-filter-clear" type="button" *if="Tags().length" (click)="Clear">{{$T('ui.media.clear')}}</button>
	</div>
	<div class="elemenx-facet-filter-chips" *if="Chips && Chips !== 'false' && Tags().length">
		<span class="elemenx-chip elemenx-facet-filter-chip" *for="tag of Tags()" *key="tag.Key" [attribute.data-tag]="tag.Key" [attribute.data-facet]="tag.Facet" [attribute.data-value]="tag.Value === null ? '' : tag.Value">{{tag.Label}}<button type="button" class="elemenx-facet-filter-remove elemenx-bare" [attribute.aria-label]="$T('ui.media.remove') + ' ' + tag.Label" (click)="Removed"><Icon Name="close" Size="14" /></button></span>
	</div>
	<section class="elemenx-facet" *for="facet of Facets" *key="facet.ID" [attribute.data-facet]="facet.ID" [class.active]="Active(facet)">
		<button class="elemenx-facet-header elemenx-bare" type="button" [attribute.aria-expanded]="String(Expanded(facet))" (click)="Toggled">
			<span class="elemenx-facet-label">{{facet.Label}}</span>
			<Icon [name]="Expanded(facet) ? 'chevron-up' : 'chevron-down'" Size="16" />
		</button>
		<div class="elemenx-facet-body" *if="Expanded(facet)" [attribute.data-type]="TypeOf(facet)">
			<div class="elemenx-facet-options" *if="TypeOf(facet) === 'options'">
				<input class="elemenx-facet-search" type="search" *if="Choices(facet).length > 12" [value]="Searches[facet.ID] || ''" [attribute.placeholder]="$T('ui.media.find')" [attribute.aria-label]="$T('ui.media.find') + ' ' + facet.Label" (input)="Searched" />
				<label class="elemenx-facet-option" *for="option of Visible(facet)" *key="option.Value" [attribute.data-value]="option.Value"><input type="checkbox" [checked]="Chosen(facet).map(String).indexOf(String(option.Value)) !== -1" (change)="Checked" /><span class="elemenx-facet-option-label">{{option.Label}}</span><span class="elemenx-facet-count" *if="Count(facet, option) !== null">{{Count(facet, option)}}</span></label>
				<button class="elemenx-facet-more elemenx-bare" type="button" *if="Hidden(facet)" (click)="ShowAll">{{$T('ui.media.showAll')}} ({{Hidden(facet)}})</button>
			</div>
			<div class="elemenx-facet-options" *if="TypeOf(facet) === 'choice'">
				<label class="elemenx-facet-option" data-value=""><input type="radio" [attribute.name]="'facet-' + facet.ID" value="" [checked]="Chosen(facet) === null" (change)="Picked" /><span class="elemenx-facet-option-label">{{$T('ui.media.any')}}</span></label>
				<label class="elemenx-facet-option" *for="option of Choices(facet)" *key="option.Value" [attribute.data-value]="option.Value"><input type="radio" [attribute.name]="'facet-' + facet.ID" [value]="String(option.Value)" [checked]="String(Chosen(facet)) === String(option.Value)" (change)="Picked" /><span class="elemenx-facet-option-label">{{option.Label}}</span><span class="elemenx-facet-count" *if="Count(facet, option) !== null">{{Count(facet, option)}}</span></label>
			</div>
			<div class="elemenx-facet-options" *if="TypeOf(facet) === 'rating'">
				<label class="elemenx-facet-option" data-value=""><input type="radio" [attribute.name]="'facet-' + facet.ID" value="" [checked]="Chosen(facet) === null" (change)="Picked" /><span class="elemenx-facet-option-label">{{$T('ui.media.any')}}</span></label>
				<label class="elemenx-facet-option" *for="option of Scores(facet)" *key="option.Value" [attribute.data-value]="option.Value"><input type="radio" [attribute.name]="'facet-' + facet.ID" [value]="String(option.Value)" [checked]="String(Chosen(facet)) === String(option.Value)" (change)="Picked" /><span class="elemenx-facet-option-label"><Icon Name="star-filled" Size="14" /> {{option.Label}}</span><span class="elemenx-facet-count" *if="Count(facet, option) !== null">{{Count(facet, option)}}</span></label>
			</div>
			<div class="elemenx-facet-range" *if="TypeOf(facet) === 'range'">
				<input type="number" data-bound="from" [attribute.min]="facet.Min" [attribute.max]="facet.Max" [attribute.step]="facet.Step || 1" [attribute.placeholder]="facet.Min === undefined ? '' : String(facet.Min)" [value]="Chosen(facet)[0] === null || Chosen(facet)[0] === undefined ? '' : Chosen(facet)[0]" [attribute.aria-label]="facet.Label + ', ' + $T('ui.media.from')" (change)="Ranged" />
				<span aria-hidden="true">–</span>
				<input type="number" data-bound="to" [attribute.min]="facet.Min" [attribute.max]="facet.Max" [attribute.step]="facet.Step || 1" [attribute.placeholder]="facet.Max === undefined ? '' : String(facet.Max)" [value]="Chosen(facet)[1] === null || Chosen(facet)[1] === undefined ? '' : Chosen(facet)[1]" [attribute.aria-label]="facet.Label + ', ' + $T('ui.media.to')" (change)="Ranged" />
				<span class="elemenx-facet-unit" *if="facet.Unit">{{facet.Unit}}</span>
			</div>
			<label class="elemenx-facet-option" *if="TypeOf(facet) === 'toggle'"><input type="checkbox" [checked]="Chosen(facet)" (change)="Switched" /><span class="elemenx-facet-option-label">{{facet.Hint || facet.Label}}</span></label>
		</div>
	</section>
</div>

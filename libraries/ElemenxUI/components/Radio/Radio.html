<label class="elemenx-check elemenx-radio" [class]="[Variant || 'default', Size || 'medium', Checked ? 'checked' : '', Disabled ? 'disabled' : '', Invalid ? 'invalid' : '']">
	<input class="elemenx-check-input" type="radio" [checked]="Checked" [disabled]="Disabled" [attribute.name]="Name" [attribute.value]="Value" (change)="Picked" />
	<span class="elemenx-check-box" aria-hidden="true"></span>
	<span class="elemenx-check-text" *if="Label || Description">
		<span class="elemenx-check-label" *if="Label">{{Label}}</span>
		<span class="elemenx-caption" *if="Description">{{Description}}</span>
	</span>
	<slot></slot>
</label>

<div class="elemenx-ribbon-backstage" *layer role="dialog" aria-modal="true" [attribute.aria-label]="(Title || $T('ui.ribbonBackstage.title'))" (keydown)="Key">
	<nav class="elemenx-column elemenx-ribbon-backstage-nav">
		<button class="elemenx-ribbon-backstage-back" type="button" [attribute.aria-label]="$T('ui.common.back')" [attribute.title]="$T('ui.common.back') + ' (Escape)'" (click)="Back"><Icon Name="arrow-left" Size="24" /></button>
		<button class="elemenx-ribbon-backstage-item" type="button" *for="page of Pages" *key="page.ID" [class.active]="!page.Command && page.ID === Shown(Page, Pages)" [class.command]="page.Command" [attribute.aria-current]="!page.Command && page.ID === Shown(Page, Pages) ? 'page' : null" [attribute.data-id]="page.ID" (click)="Choose">
			<Icon *if="page.Icon" [name]="page.Icon" />
			<span>{{page.Title}}</span>
		</button>
	</nav>
	<div class="elemenx-column fill elemenx-ribbon-backstage-content" [attribute.data-page]="Shown(Page, Pages)"><slot></slot></div>
</div>

<div class="elemenx-rich-editor" [class]="[ReadOnly ? 'readonly' : '', Disabled ? 'disabled' : '', MaxRows ? '' : 'growing']" [attribute.style]="'--elemenx-rich-editor-rows: ' + Rows + '; --elemenx-rich-editor-max-rows: ' + (MaxRows || 0) + ';'">
	<div class="elemenx-rich-editor-content elemenx-document" role="textbox" aria-multiline="true" spellcheck="true" [attribute.contenteditable]="ReadOnly || Disabled ? 'false' : 'true'" [attribute.aria-readonly]="ReadOnly ? 'true' : null" [attribute.aria-disabled]="Disabled ? 'true' : null" [attribute.aria-label]="Label || $T('ui.richEditor.label')" [attribute.data-placeholder]="Placeholder || $T('ui.richEditor.placeholder')" (input)="Typed" (keydown)="Key" (paste)="Pasted" (drop)="Dropped" (dragover)="Over" (blur)="Blurred"></div>
	<i class="elemenx-rich-editor-sync" hidden *mount="Sync(Value)"></i>
	<div class="elemenx-rich-editor-find" *if="Finding"><FindBar Autofocus="true" [query]="FindQuery" [count]="FindCount" [index]="FindIndex" [canreplace]="!ReadOnly && !Disabled" [replacing]="FindReplacing" [label]="Label" (find)="BarFind" (next)="BarNext" (previous)="BarPrevious" (replace)="BarReplace" (replaceall)="BarReplaceAll" (close)="CloseFind" /></div>
	<div class="elemenx-rich-editor-menu" role="toolbar" *if="MenuOpen" [attribute.style]="MenuStyle" [attribute.aria-label]="$T('ui.richEditor.formatting')" (mousedown)="Hold">
		<div class="elemenx-rich-editor-actions" *if="!LinkMode">
			<span class="elemenx-rich-editor-action" data-command="bold"><Button Variant="ghost" Size="small" Icon="bold" [pressed]="!!(Active.Bold)" [title]="$T('ui.richEditor.bold')" (click)="Act" /></span>
			<span class="elemenx-rich-editor-action" data-command="italic"><Button Variant="ghost" Size="small" Icon="italic" [pressed]="!!(Active.Italic)" [title]="$T('ui.richEditor.italic')" (click)="Act" /></span>
			<span class="elemenx-rich-editor-action" data-command="underline"><Button Variant="ghost" Size="small" Icon="underline" [pressed]="!!(Active.Underline)" [title]="$T('ui.richEditor.underline')" (click)="Act" /></span>
			<span class="elemenx-rich-editor-action" data-command="strike"><Button Variant="ghost" Size="small" Icon="strikethrough" [pressed]="!!(Active.Strike)" [title]="$T('ui.richEditor.strike')" (click)="Act" /></span>
			<span class="elemenx-rich-editor-action" data-command="code"><Button Variant="ghost" Size="small" Icon="code" [pressed]="!!(Active.Code)" [title]="$T('ui.richEditor.code')" (click)="Act" /></span>
			<span class="elemenx-rich-editor-separator"></span>
			<span class="elemenx-rich-editor-action" data-command="link"><Button Variant="ghost" Size="small" Icon="link" [pressed]="!!(!!Active.Link)" [title]="$T('ui.richEditor.link')" (click)="Act" /></span>
			<span class="elemenx-rich-editor-action" data-command="heading"><Button Variant="ghost" Size="small" Icon="heading" [pressed]="!!(Active.Level === 2)" [title]="$T('ui.richEditor.heading')" (click)="Act" /></span>
			<span class="elemenx-rich-editor-action" data-command="quote"><Button Variant="ghost" Size="small" Icon="quote" [pressed]="!!(Active.Quote)" [title]="$T('ui.richEditor.quote')" (click)="Act" /></span>
			<span class="elemenx-rich-editor-action" data-command="clear"><Button Variant="ghost" Size="small" Icon="clear-format" [title]="$T('ui.richEditor.clear')" (click)="Act" /></span>
		</div>
		<input class="elemenx-rich-editor-link" type="url" *if="LinkMode" [value]="LinkText" [placeholder]="$T('ui.richEditor.linkPlaceholder')" [attribute.aria-label]="$T('ui.richEditor.link')" (keydown)="LinkKey" (blur)="LinkLeft" />
	</div>
</div>

<div class="elemenx-rich-editor" [class]="[ReadOnly ? 'readonly' : '', Disabled ? 'disabled' : '', MaxRows ? '' : 'growing']" [attribute.style]="'--elemenx-rich-editor-rows: ' + Rows + '; --elemenx-rich-editor-max-rows: ' + (MaxRows || 0) + ';'">
	<div class="elemenx-rich-editor-content" role="textbox" aria-multiline="true" spellcheck="true" [attribute.contenteditable]="ReadOnly || Disabled ? 'false' : 'true'" [attribute.aria-readonly]="ReadOnly ? 'true' : null" [attribute.aria-disabled]="Disabled ? 'true' : null" [attribute.aria-label]="Label || $T('ui.richEditor.label')" [attribute.data-placeholder]="Placeholder || $T('ui.richEditor.placeholder')" (input)="Typed" (keydown)="Key" (paste)="Pasted" (drop)="Dropped" (dragover)="Over" (blur)="Blurred"></div>
	<i class="elemenx-rich-editor-sync" hidden *mount="Sync(Value)"></i>
	<div class="elemenx-rich-editor-menu" role="toolbar" *if="MenuOpen" [attribute.style]="MenuStyle" [attribute.aria-label]="$T('ui.richEditor.formatting')" (mousedown)="Hold">
		<div class="elemenx-rich-editor-actions" *if="!LinkMode">
			<button class="elemenx-rich-editor-action" type="button" data-command="bold" [class.active]="Active.Bold" [attribute.aria-pressed]="Active.Bold ? 'true' : 'false'" [attribute.aria-label]="$T('ui.richEditor.bold')" [attribute.title]="$T('ui.richEditor.bold')" (click)="Act"><Icon Name="bold" /></button>
			<button class="elemenx-rich-editor-action" type="button" data-command="italic" [class.active]="Active.Italic" [attribute.aria-pressed]="Active.Italic ? 'true' : 'false'" [attribute.aria-label]="$T('ui.richEditor.italic')" [attribute.title]="$T('ui.richEditor.italic')" (click)="Act"><Icon Name="italic" /></button>
			<button class="elemenx-rich-editor-action" type="button" data-command="underline" [class.active]="Active.Underline" [attribute.aria-pressed]="Active.Underline ? 'true' : 'false'" [attribute.aria-label]="$T('ui.richEditor.underline')" [attribute.title]="$T('ui.richEditor.underline')" (click)="Act"><Icon Name="underline" /></button>
			<button class="elemenx-rich-editor-action" type="button" data-command="strike" [class.active]="Active.Strike" [attribute.aria-pressed]="Active.Strike ? 'true' : 'false'" [attribute.aria-label]="$T('ui.richEditor.strike')" [attribute.title]="$T('ui.richEditor.strike')" (click)="Act"><Icon Name="strikethrough" /></button>
			<button class="elemenx-rich-editor-action" type="button" data-command="code" [class.active]="Active.Code" [attribute.aria-pressed]="Active.Code ? 'true' : 'false'" [attribute.aria-label]="$T('ui.richEditor.code')" [attribute.title]="$T('ui.richEditor.code')" (click)="Act"><Icon Name="code" /></button>
			<span class="elemenx-rich-editor-separator"></span>
			<button class="elemenx-rich-editor-action" type="button" data-command="link" [class.active]="!!Active.Link" [attribute.aria-pressed]="Active.Link ? 'true' : 'false'" [attribute.aria-label]="$T('ui.richEditor.link')" [attribute.title]="$T('ui.richEditor.link')" (click)="Act"><Icon Name="link" /></button>
			<button class="elemenx-rich-editor-action" type="button" data-command="heading" [class.active]="Active.Level === 2" [attribute.aria-pressed]="Active.Level === 2 ? 'true' : 'false'" [attribute.aria-label]="$T('ui.richEditor.heading')" [attribute.title]="$T('ui.richEditor.heading')" (click)="Act"><Icon Name="heading" /></button>
			<button class="elemenx-rich-editor-action" type="button" data-command="quote" [class.active]="Active.Quote" [attribute.aria-pressed]="Active.Quote ? 'true' : 'false'" [attribute.aria-label]="$T('ui.richEditor.quote')" [attribute.title]="$T('ui.richEditor.quote')" (click)="Act"><Icon Name="quote" /></button>
			<button class="elemenx-rich-editor-action" type="button" data-command="clear" [attribute.aria-label]="$T('ui.richEditor.clear')" [attribute.title]="$T('ui.richEditor.clear')" (click)="Act"><Icon Name="clear-format" /></button>
		</div>
		<input class="elemenx-rich-editor-link" type="url" *if="LinkMode" [value]="LinkText" [placeholder]="$T('ui.richEditor.linkPlaceholder')" [attribute.aria-label]="$T('ui.richEditor.link')" (keydown)="LinkKey" (blur)="LinkLeft" />
	</div>
</div>

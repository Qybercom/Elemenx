<div class="elemenx-designer-rules">
	<p class="elemenx-text small muted" *if="!Current(Version)">{{$T('ui.designer.nothing')}}</p>
	<div class="elemenx-designer-rules-body" *if="Current(Version)">
		<div class="elemenx-designer-rules-context">
			<Field [label]="$T('ui.designer.rules.who')">
				<Select Size="small" Name="Who" [options]="Whos(Current(Version), Version)" [value]="Who" (change)="Contexted" />
			</Field>
			<Field [label]="$T('ui.designer.rules.when')">
				<Select Size="small" Name="When" [options]="Whens($T('ui.designer.rules.when'))" [value]="When" (change)="Contexted" />
			</Field>
			<Field [label]="$T('ui.designer.rules.where')">
				<Select Size="small" Name="Where" [options]="Wheres($T('ui.designer.rules.where'))" [value]="Where" (change)="Contexted" />
			</Field>
			<Field [label]="$T('ui.designer.rules.scheme')">
				<Select Size="small" Name="Scheme" [options]="Schemes($T('ui.designer.rules.scheme'))" [value]="Scheme" (change)="Contexted" />
			</Field>
		</div>
		<div class="elemenx-designer-rules-list">
			<div class="elemenx-designer-rules-row" *for="item of Props(Current(Version), Who, When, Where, Scheme, Version)" *key="item.Name">
				<code class="elemenx-designer-rules-name">{{item.Name}}</code>
				<div class="elemenx-designer-rules-field">
					<Combobox Size="small" AllowCustom="true" [options]="Tokens(Scheme)" [name]="item.Name" [value]="item.Value" (change)="Valued" />
					<code class="elemenx-designer-rules-computed" *if="Computed(item.Value, Scheme)">{{Computed(item.Value, Scheme)}}</code>
				</div>
				<button type="button" class="elemenx-designer-list-button" [attribute.title]="$T('ui.designer.delete')" [attribute.data-property]="item.Name" (click)="Removed"><Icon Name="delete" Size="14" /></button>
			</div>
			<div class="elemenx-designer-rules-row">
				<div class="elemenx-designer-rules-property">
					<Combobox Size="small" AllowCustom="true" [options]="Properties()" [placeholder]="$T('ui.designer.rules.property')" [value]="Property" (change)="PropertyChosen" />
				</div>
				<div class="elemenx-designer-rules-value">
					<Combobox Size="small" AllowCustom="true" [options]="Tokens(Scheme)" [placeholder]="$T('ui.designer.rules.value')" [value]="Value" (change)="ValueChosen" />
				</div>
				<button type="button" class="elemenx-designer-list-button elemenx-designer-rules-add" [attribute.title]="$T('ui.designer.rules.add')" (click)="Added"><Icon Name="add" Size="14" /></button>
			</div>
		</div>
		<div class="elemenx-designer-rules-others" *if="Others(Current(Version), Who, When, Where, Scheme, Version).length">
			<span class="elemenx-label">{{$T('ui.designer.rules.others')}}</span>
			<button type="button" class="elemenx-designer-rules-other" *for="other of Others(Current(Version), Who, When, Where, Scheme, Version)" *key="other.Index" [class.active]="other.Active" [attribute.data-index]="other.Index" (click)="Picked">{{other.Text}}</button>
		</div>
	</div>
</div>

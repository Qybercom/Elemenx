<div class="elemenx-video-timeline" tabindex="0" role="application" [class.readonly]="!Editable()" [attribute.aria-label]="(Label || $T('ui.videoTimeline.label')) + ', ' + Timecode(Time)" (keydown)="Key">
	<div class="elemenx-video-timeline-toolbar">
		<span class="elemenx-video-timeline-timecode" aria-live="off">{{Timecode(Time)}}</span>
		<span class="elemenx-spacer"></span>
		<Button *if="Editable()" Variant="ghost" Size="small" Icon="cut" [title]="$T('ui.videoTimeline.split')" (click)="Split" />
		<Button *if="Editable()" Variant="ghost" Size="small" Icon="delete" [title]="$T('ui.videoTimeline.delete')" [disabled]="!Chosen.length" (click)="Delete" />
		<Button Variant="ghost" Size="small" Icon="zoom-out" [title]="$T('ui.videoTimeline.zoomOut')" (click)="ZoomOut" />
		<Button Variant="ghost" Size="small" Icon="zoom-in" [title]="$T('ui.videoTimeline.zoomIn')" (click)="ZoomIn" />
		<Button Variant="ghost" Size="small" Icon="fit-contain" [title]="$T('ui.videoTimeline.fit')" (click)="Fit" />
	</div>
	<div class="elemenx-video-timeline-body">
		<div class="elemenx-video-timeline-heads">
			<div class="elemenx-video-timeline-corner"></div>
			<div class="elemenx-video-timeline-head" *for="track of Tracks" *key="track.ID" [class]="[track.Kind || 'video']" [attribute.data-track]="track.ID">
				<Icon [name]="KindIcon(track.Kind)" Size="16" />
				<span class="elemenx-video-timeline-name">{{track.Name || track.ID}}</span>
				<button type="button" class="elemenx-video-timeline-toggle" *if="track.Kind === 'audio'" [attribute.aria-pressed]="track.Muted ? 'true' : 'false'" [attribute.title]="$T('ui.videoTimeline.mute')" [attribute.aria-label]="$T('ui.videoTimeline.mute') + ' ' + (track.Name || track.ID)" (click)="Muted"><Icon [name]="track.Muted ? 'volume-off' : 'volume'" Size="16" /></button>
				<button type="button" class="elemenx-video-timeline-toggle" *if="track.Kind !== 'audio'" [attribute.aria-pressed]="track.Hidden ? 'true' : 'false'" [attribute.title]="$T('ui.videoTimeline.hide')" [attribute.aria-label]="$T('ui.videoTimeline.hide') + ' ' + (track.Name || track.ID)" (click)="Hid"><Icon [name]="track.Hidden ? 'eye-off' : 'eye'" Size="16" /></button>
				<button type="button" class="elemenx-video-timeline-toggle" [attribute.aria-pressed]="track.Locked ? 'true' : 'false'" [attribute.title]="$T('ui.videoTimeline.lock')" [attribute.aria-label]="$T('ui.videoTimeline.lock') + ' ' + (track.Name || track.ID)" (click)="Locked"><Icon [name]="track.Locked ? 'lock' : 'unlock'" Size="16" /></button>
			</div>
		</div>
		<div class="elemenx-video-timeline-scroller" (pointerdown)="Down" (pointermove)="Move" (pointerup)="Up" (pointercancel)="Up">
			<div class="elemenx-video-timeline-content" [style.width]="Width() + 'px'">
				<div class="elemenx-video-timeline-ruler">
					<span class="elemenx-video-timeline-tick" *for="tick of Ticks()" *key="tick.Key" [class.major]="tick.Major" [style.left]="tick.X + 'px'">{{tick.Label}}</span>
					<span class="elemenx-video-timeline-marker" *for="marker of Markers || []" *key="marker.ID || marker.Time" [attribute.style]="Marked(marker)" [attribute.title]="marker.Label || ''"></span>
				</div>
				<div class="elemenx-video-timeline-lane" *for="track of Tracks" *key="track.ID" [class]="[track.Kind || 'video', track.Hidden ? 'hidden' : '', track.Muted ? 'muted' : '', track.Locked ? 'locked' : '']" [attribute.data-track]="track.ID">
					<div class="elemenx-video-timeline-clip" *for="clip of track.Clips || []" *key="clip.ID" [class.selected]="IsChosen(clip)" [class.pictured]="!!clip.Thumbnail" [attribute.data-clip]="clip.ID" [attribute.style]="Place(clip, track)" [attribute.title]="(clip.Name || '') + ' ' + Timecode(clip.Start) + ' – ' + Timecode(End(clip))">
						<span class="elemenx-video-timeline-edge start" *if="!track.Locked && Editable()"></span>
						<svg class="elemenx-video-timeline-wave" *if="track.Kind === 'audio' && clip.Peaks && clip.Peaks.length" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path [attribute.d]="Wave(clip)"></path></svg>
						<span class="elemenx-video-timeline-label">{{track.Kind === 'text' ? (clip.Text || clip.Name || '') : (clip.Name || '')}}</span>
						<span class="elemenx-video-timeline-edge end" *if="!track.Locked && Editable()"></span>
					</div>
				</div>
				<span class="elemenx-video-timeline-guide" *if="Guide !== null" [style.left]="Math.round(Guide * Pixels()) + 'px'"></span>
				<span class="elemenx-video-timeline-playhead" [style.left]="Head() + 'px'"><span class="elemenx-video-timeline-knob"></span></span>
			</div>
		</div>
	</div>
</div>

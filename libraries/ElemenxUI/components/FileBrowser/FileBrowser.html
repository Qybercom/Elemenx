<div class="elemenx-file-browser" [class.grid]="View === 'grid'" [class.tree]="View === 'tree'" [class.plain]="!Details || Details === 'false'" role="region" [attribute.aria-label]="Label || $T('ui.fileBrowser.label')">
	<div class="elemenx-file-browser-bar" *if="Toolbar && Toolbar !== 'false'">
		<Button *if="View !== 'tree'" Variant="ghost" Size="small" Icon="arrow-up" [arialabel]="$T('ui.fileBrowser.up')" [disabled]="!Path.length" (click)="Up" />
		<Breadcrumbs *if="View !== 'tree'" class="elemenx-file-browser-path" [items]="Crumbs(Items, Path, Root)" (select)="Crumb" />
		<span class="elemenx-file-browser-path" *if="View === 'tree'"></span>
		<span class="elemenx-file-browser-views" role="group" [attribute.aria-label]="$T('ui.fileBrowser.view')">
			<button type="button" class="elemenx-file-browser-view" data-view="list" [attribute.aria-pressed]="String(View !== 'grid' && View !== 'tree')" [attribute.aria-label]="$T('ui.fileBrowser.list')" (click)="Viewed"><Icon Name="list" /></button>
			<button type="button" class="elemenx-file-browser-view" data-view="tree" [attribute.aria-pressed]="String(View === 'tree')" [attribute.aria-label]="$T('ui.fileBrowser.tree')" (click)="Viewed"><Icon Name="tree" /></button>
			<button type="button" class="elemenx-file-browser-view" data-view="grid" [attribute.aria-pressed]="String(View === 'grid')" [attribute.aria-label]="$T('ui.fileBrowser.grid')" (click)="Viewed"><Icon Name="grid" /></button>
		</span>
	</div>
	<div class="elemenx-file-browser-head" *if="View !== 'grid' && Details && Details !== 'false'" role="presentation">
		<button type="button" class="elemenx-file-browser-sort name" data-sort="Name" [class.active]="Sort === 'Name'" (click)="Sorted">{{$T('ui.fileBrowser.name')}}<Icon *if="Sort === 'Name'" Size="12" [name]="Descending ? 'chevron-up' : 'chevron-down'" /></button>
		<button type="button" class="elemenx-file-browser-sort size" data-sort="Size" [class.active]="Sort === 'Size'" (click)="Sorted">{{$T('ui.fileBrowser.size')}}<Icon *if="Sort === 'Size'" Size="12" [name]="Descending ? 'chevron-up' : 'chevron-down'" /></button>
		<button type="button" class="elemenx-file-browser-sort modified" data-sort="Modified" [class.active]="Sort === 'Modified'" (click)="Sorted">{{$T('ui.fileBrowser.modified')}}<Icon *if="Sort === 'Modified'" Size="12" [name]="Descending ? 'chevron-up' : 'chevron-down'" /></button>
	</div>
	<div class="elemenx-file-browser-items" [attribute.role]="View === 'tree' ? 'tree' : 'listbox'" [attribute.aria-multiselectable]="Multiple ? 'true' : 'false'" [style.height]="Height + 'px'" (keydown)="Key">
		<div class="elemenx-file-browser-item" [attribute.role]="View === 'tree' ? 'treeitem' : 'option'" *for="row of Rows(Items, Path, Sort, Descending, View, Expanded)" *key="row.Item.ID" [attribute.data-id]="row.Item.ID" [class.selected]="Picked(Selected, row.Item.ID)" [class.folder]="Folder(row.Item)" [attribute.aria-selected]="String(Picked(Selected, row.Item.ID))" [attribute.aria-level]="View === 'tree' ? row.Depth + 1 : null" [attribute.aria-expanded]="View === 'tree' && Folder(row.Item) ? String(row.Open) : null" [attribute.tabindex]="$index === 0 ? 0 : -1" [style.padding-inline-start]="View === 'tree' ? (6 + row.Depth * 18) + 'px' : null" (click)="Pressed" (dblclick)="Opened">
			<span class="elemenx-file-browser-twisty" *if="View === 'tree'"><button type="button" tabindex="-1" *if="Folder(row.Item)" [attribute.aria-label]="$T('ui.fileBrowser.toggle')" (click)="Toggle"><Icon Size="14" [name]="row.Open ? 'chevron-down' : 'chevron-right'" /></button></span>
			<span class="elemenx-file-browser-icon"><Icon *if="Folder(row.Item)" [name]="row.Item.Icon || (row.Open ? 'folder-open' : 'folder')" [size]="View === 'grid' ? 40 : 18" /><FileIcon *if="!Folder(row.Item)" [name]="row.Item.Name" [size]="View === 'grid' ? 40 : 18" /></span>
			<span class="elemenx-file-browser-name elemenx-ellipsis">{{row.Item.Name}}</span>
			<span class="elemenx-file-browser-size">{{Size(row.Item)}}</span>
			<span class="elemenx-file-browser-modified">{{When(row.Item.Modified)}}</span>
		</div>
		<div class="elemenx-file-browser-empty elemenx-text muted" *if="!Loading(Items, Path) && !Rows(Items, Path, Sort, Descending, View, Expanded).length">{{$T('ui.fileBrowser.empty')}}</div>
		<div class="elemenx-file-browser-empty" *if="Loading(Items, Path) && View !== 'tree'"><Spinner Size="small" /></div>
	</div>
</div>

<div class="elemenx-input elemenx-card-input" [class]="[Size || 'medium', Invalid || (Touched && Value && String(Value).length !== Number(Length)) ? 'invalid' : '', Disabled ? 'disabled' : '']">
	<Icon Name="lock" />
	<input class="elemenx-input-control" inputmode="numeric" autocomplete="cc-csc" [type]="Revealed ? 'text' : 'password'" *mask="{Mask: Number(Length) === 4 ? '####' : '###', Value: Value}" [placeholder]="Placeholder || (Number(Length) === 4 ? '0000' : '000')" [disabled]="Disabled" [attribute.name]="Name" [attribute.maxlength]="Length" (mask)="Masked" (change)="Committed" />
	<button class="elemenx-input-action" type="button" [attribute.aria-label]="Revealed ? 'Hide code' : 'Show code'" [attribute.aria-pressed]="String(Revealed)" (click)="Reveal"><Icon [name]="Revealed ? 'eye-off' : 'eye'" /></button>
</div>

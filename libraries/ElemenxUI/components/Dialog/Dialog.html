<dialog class="elemenx-dialog" *modal="Open" [class]="[Size || 'medium']" [attribute.aria-label]="Title || null" (dismiss)="Dismissed">
	<header class="elemenx-dialog-header" *if="Title || Closable">
		<Icon *if="Icon" [name]="Icon" Size="20" />
		<div class="elemenx-dialog-heading">
			<h2 class="elemenx-dialog-title" *if="Title">{{Title}}</h2>
			<p class="elemenx-caption" *if="Description">{{Description}}</p>
		</div>
		<Button *if="Closable" Icon="close" Title="Close" Variant="ghost" Size="small" (click)="Close" />
	</header>
	<div class="elemenx-dialog-body" [class.padded]="Padded"><slot></slot></div>
	<footer class="elemenx-dialog-footer"><slot name="footer"></slot></footer>
</dialog>

<div class="elemenx-slider" [class]="[Size || 'medium', Disabled ? 'disabled' : '', Range ? 'range' : '', Orientation === 'vertical' ? 'vertical' : '']" (pointerdown)="Down" (pointermove)="Move" (pointerup)="Up" (pointercancel)="Up">
	<div class="elemenx-slider-track">

		<span class="elemenx-slider-tick" *for="tick of Ticks(Marks, Min, Max)" *key="tick" [style.inset-inline-start]="Orientation === 'vertical' ? null : Percent(tick) + '%'" [style.bottom]="Orientation === 'vertical' ? Percent(tick) + '%' : null"></span>
		<span class="elemenx-slider-thumb" role="slider" *for="value of Values(Value, Range)" *key="$index" [attribute.tabindex]="Disabled ? null : 0" [attribute.aria-label]="Label + (Range ? ($index === 0 ? ' (from)' : ' (to)') : '') || null" [attribute.aria-valuemin]="Min" [attribute.aria-valuemax]="Max" [attribute.aria-valuenow]="value" [attribute.aria-valuetext]="value + Unit" [attribute.aria-disabled]="Disabled ? 'true' : null" [attribute.aria-orientation]="Orientation === 'vertical' ? 'vertical' : null" [attribute.data-thumb]="$index" [class.active]="Active === $index" [style.inset-inline-start]="Orientation === 'vertical' ? null : Percent(value) + '%'" [style.bottom]="Orientation === 'vertical' ? Percent(value) + '%' : null" (focus)="Focus" (blur)="Blur" (keydown)="Key">
			<span class="elemenx-slider-value" *if="ShowValue === 'always' || (ShowValue === 'active' && Active === $index)">{{value}}{{Unit}}</span>
		</span>
	</div>
</div>

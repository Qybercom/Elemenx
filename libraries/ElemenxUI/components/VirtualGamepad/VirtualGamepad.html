<div class="elemenx-virtual-pad" role="group" [attribute.aria-label]="Label || $T('ui.virtualGamepad.label')" [hidden]="!Shown(Show)" [class.with-right]="Right && Right !== 'false'">
	<div class="elemenx-virtual-pad-zone left" *if="Floating && Floating !== 'false'" data-stick="left" (pointerdown)="ZoneDown" (pointermove)="StickMove" (pointerup)="StickUp" (pointercancel)="StickUp" (lostpointercapture)="StickUp"></div>
	<div class="elemenx-virtual-pad-zone right" *if="Floating && Floating !== 'false' && Right && Right !== 'false'" data-stick="right" (pointerdown)="ZoneDown" (pointermove)="StickMove" (pointerup)="StickUp" (pointercancel)="StickUp" (lostpointercapture)="StickUp"></div>
	<div class="elemenx-virtual-pad-shoulders left">
		<button type="button" tabindex="-1" class="elemenx-virtual-pad-button shoulder" *for="button of Listed(Buttons, 'left')" *key="button" [attribute.data-button]="button" [class.down]="!!Down[button]" [attribute.aria-label]="LabelOf(button)" (pointerdown)="ButtonDown" (pointerup)="ButtonUp" (pointercancel)="ButtonUp" (lostpointercapture)="ButtonUp">{{LabelOf(button)}}</button>
	</div>
	<div class="elemenx-virtual-pad-shoulders right">
		<button type="button" tabindex="-1" class="elemenx-virtual-pad-button shoulder" *for="button of Listed(Buttons, 'right')" *key="button" [attribute.data-button]="button" [class.down]="!!Down[button]" [attribute.aria-label]="LabelOf(button)" (pointerdown)="ButtonDown" (pointerup)="ButtonUp" (pointercancel)="ButtonUp" (lostpointercapture)="ButtonUp">{{LabelOf(button)}}</button>
	</div>
	<div class="elemenx-virtual-pad-stick left" data-stick="left" role="slider" [style.width]="Size + 'px'" [style.height]="Size + 'px'" [style.transform]="'translate(' + Moved.left[0] + 'px, ' + Moved.left[1] + 'px)'" [attribute.aria-label]="$T('ui.virtualGamepad.stick')" (pointerdown)="StickDown" (pointermove)="StickMove" (pointerup)="StickUp" (pointercancel)="StickUp" (lostpointercapture)="StickUp">
		<span class="elemenx-virtual-pad-knob" [style.transform]="'translate(' + (Knobs.left[0] * 64) + '%, ' + (Knobs.left[1] * 64) + '%)'"></span>
	</div>
	<div class="elemenx-virtual-pad-dpad" *if="Listed(Buttons, 'dpad').length">
		<button type="button" tabindex="-1" class="elemenx-virtual-pad-button dpad" *for="button of Listed(Buttons, 'dpad')" *key="button" [attribute.data-button]="button" [class]="['dpad-' + button]" [class.down]="!!Down[button]" [attribute.aria-label]="LabelOf(button)" (pointerdown)="ButtonDown" (pointerup)="ButtonUp" (pointercancel)="ButtonUp" (lostpointercapture)="ButtonUp">{{LabelOf(button)}}</button>
	</div>
	<div class="elemenx-virtual-pad-middle">
		<button type="button" tabindex="-1" class="elemenx-virtual-pad-button small" *for="button of Listed(Buttons, 'middle')" *key="button" [attribute.data-button]="button" [class.down]="!!Down[button]" [attribute.aria-label]="LabelOf(button)" (pointerdown)="ButtonDown" (pointerup)="ButtonUp" (pointercancel)="ButtonUp" (lostpointercapture)="ButtonUp">{{LabelOf(button)}}</button>
	</div>
	<div class="elemenx-virtual-pad-face">
		<button type="button" tabindex="-1" class="elemenx-virtual-pad-button" *for="button of Listed(Buttons, 'face')" *key="button" [attribute.data-button]="button" [class]="['face-' + button]" [class.down]="!!Down[button]" [attribute.aria-label]="LabelOf(button)" (pointerdown)="ButtonDown" (pointerup)="ButtonUp" (pointercancel)="ButtonUp" (lostpointercapture)="ButtonUp">{{LabelOf(button)}}</button>
	</div>
	<div class="elemenx-virtual-pad-stick right" *if="Right && Right !== 'false'" data-stick="right" role="slider" [style.width]="Size + 'px'" [style.height]="Size + 'px'" [style.transform]="'translate(' + Moved.right[0] + 'px, ' + Moved.right[1] + 'px)'" [attribute.aria-label]="$T('ui.virtualGamepad.look')" (pointerdown)="StickDown" (pointermove)="StickMove" (pointerup)="StickUp" (pointercancel)="StickUp" (lostpointercapture)="StickUp">
		<span class="elemenx-virtual-pad-knob" [style.transform]="'translate(' + (Knobs.right[0] * 64) + '%, ' + (Knobs.right[1] * 64) + '%)'"></span>
	</div>
</div>

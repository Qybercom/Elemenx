<div class="elemenx-select elemenx-popup-anchor">
	<div class="elemenx-input elemenx-select-trigger" role="combobox" aria-haspopup="listbox" [attribute.aria-label]="Label || null" [attribute.tabindex]="Disabled ? null : 0" [class]="[Size || 'medium', Shape === 'round' ? 'round' : '', Invalid ? 'invalid' : '', Disabled ? 'disabled' : '', Open ? 'open' : '']" [attribute.aria-expanded]="String(Open)" [attribute.aria-disabled]="Disabled ? 'true' : null" (click)="Toggle" (keydown)="Key">
		<Icon *if="Icon" [name]="Icon" />
		<Icon *if="!Icon && Find(Options, Value) && Find(Options, Value).Icon" [name]="(Find(Options, Value) || {}).Icon" />
		<span class="elemenx-select-value" [class.placeholder]="!Find(Options, Value)">{{Find(Options, Value) ? Find(Options, Value).Label : (Placeholder || $T('ui.select.placeholder'))}}</span>
		<button class="elemenx-input-action" type="button" tabindex="-1" [attribute.aria-label]="$T('ui.common.clear')" *if="Clearable && Find(Options, Value) && !Disabled" (click)="Clear"><Icon Name="close" /></button>
		<Icon Name="chevron-down" />
	</div>
	<input type="hidden" *if="Name" [attribute.name]="Name" [value]="Value == null ? '' : Value" />
	<div class="elemenx-popup" role="listbox" *popup="Open" (dismiss)="Dismissed" (keydown)="Key">
		<div class="elemenx-input small elemenx-popup-search" *if="Searchable">
			<Icon Name="search" />
			<input class="elemenx-input-control" type="text" [attribute.placeholder]="$T('ui.common.search')" autocomplete="off" [value]="Filter" (input)="Search" />
		</div>
		<div class="elemenx-popup-entry" *for="option of (Open ? Visible(Options, Filter) : [])" *key="String(option.Value)">
			<div class="elemenx-popup-group" *if="option.Group && ($index === 0 || Visible(Options, Filter)[$index - 1].Group !== option.Group)">{{option.Group}}</div>
			<div class="elemenx-option" role="option" [class.active]="$index === Active" [class.selected]="option.Value === Value" [class.disabled]="!!option.Disabled" [attribute.aria-selected]="String(option.Value === Value)" [attribute.aria-disabled]="option.Disabled ? 'true' : null" [attribute.data-index]="$index" (mousedown)="Prevent" (mousemove)="Hover" (click)="Pick">
				<Icon *if="option.Icon" [name]="option.Icon" />
				<span class="elemenx-option-label">{{option.Label}}</span>
				<span class="elemenx-option-hint" *if="option.Hint">{{option.Hint}}</span>
				<Icon *if="option.Value === Value" Name="check" />
			</div>
		</div>
		<div class="elemenx-popup-empty" *if="!Visible(Options, Filter).length">{{(Empty || $T('ui.select.empty'))}}</div>
	</div>
</div>

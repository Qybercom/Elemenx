<label class="elemenx-toggle" [class]="[Size || 'medium', Orientation === 'vertical' ? 'vertical' : '', Three(States, Values) ? 'three position-' + Position(Value, Values) : '', !Three(States, Values) && On(Checked, Value, Values) ? 'checked' : '', Disabled ? 'disabled' : '']" (click)="Pressed">
	<input class="elemenx-check-input" type="checkbox" role="switch" *if="!Three(States, Values)" [checked]="On(Checked, Value, Values)" [disabled]="Disabled" [attribute.name]="Choices(Values) ? null : Name" [attribute.aria-checked]="String(On(Checked, Value, Values))" (change)="Toggled" />
	<span class="elemenx-toggle-track" aria-hidden="true" *if="!Three(States, Values)"><span class="elemenx-toggle-thumb"></span></span>
	<span class="elemenx-toggle-track" #Track *if="Three(States, Values)" role="slider" [attribute.tabindex]="Disabled ? '-1' : '0'" aria-valuemin="0" aria-valuemax="2" [attribute.aria-valuenow]="String(Position(Value, Values))" [attribute.aria-valuetext]="Names(Labels)[Position(Value, Values)]" [attribute.aria-label]="Label || null" [attribute.aria-disabled]="Disabled ? 'true' : null" [attribute.aria-orientation]="Orientation === 'vertical' ? 'vertical' : 'horizontal'" (keydown)="Keyed"><span class="elemenx-toggle-stop" aria-hidden="true" *for="name of Names(Labels)" *key="$index"></span><span class="elemenx-toggle-thumb"></span></span>
	<input type="hidden" *if="(Three(States, Values) || Choices(Values)) && Name" [attribute.name]="Name" [value]="FormValue(Value, Values, States)" />
	<span class="elemenx-toggle-names" aria-hidden="true" *if="Three(States, Values) && ShowLabels"><span class="elemenx-toggle-name" *for="name of Names(Labels)" *key="$index" [class.current]="$index === Position(Value, Values)">{{name}}</span></span>
	<span class="elemenx-check-text" *if="Label || Description">
		<span class="elemenx-check-label" *if="Label">{{Label}}</span>
		<span class="elemenx-caption" *if="Description">{{Description}}</span>
	</span>
</label>

<label class="elemenx-toggle" [class]="[Size || 'medium', Checked ? 'checked' : '', Disabled ? 'disabled' : '']">
	<input class="elemenx-check-input" type="checkbox" role="switch" [checked]="Checked" [disabled]="Disabled" [attribute.name]="Name" [attribute.aria-checked]="String(!!Checked)" (change)="Toggled" />
	<span class="elemenx-toggle-track" aria-hidden="true"><span class="elemenx-toggle-thumb"></span></span>
	<span class="elemenx-check-text" *if="Label || Description">
		<span class="elemenx-check-label" *if="Label">{{Label}}</span>
		<span class="elemenx-caption" *if="Description">{{Description}}</span>
	</span>
</label>

<div class="elemenx-tile-grid" [class.editable]="Editable">
	<section class="elemenx-tile-group" *for="group of Groups" *key="group.ID" *droppable="{Accept: ['tile'], Disabled: !Editable}" [attribute.data-group]="group.ID" (dropped)="DropOnGroup">
		<h3 class="elemenx-tile-group-title" *if="group.Title">{{group.Title}}</h3>
		<div class="elemenx-tile-cells">
			<div class="elemenx-tile" role="button" tabindex="0" *for="tile of group.Tiles" *key="tile.ID" *draggable="{Data: tile.ID, Type: 'tile', Disabled: !Editable}" *droppable="{Accept: ['tile'], Disabled: !Editable}" [class]="[tile.Size || 'medium']" [style.--elemenx-tile-color]="tile.Color || null" [attribute.data-id]="tile.ID" [attribute.data-group]="group.ID" [attribute.aria-label]="tile.Title" (click)="Open" (keydown)="Key" (dropped)="DropOnTile">
				<Icon *if="tile.Icon" [name]="tile.Icon" Size="24" />
				<span class="elemenx-tile-text" *if="tile.Text && tile.Size !== 'small'">{{tile.Text}}</span>
				<span class="elemenx-tile-title" *if="tile.Size !== 'small'">{{tile.Title}}</span>
				<span class="elemenx-tile-badge" *if="tile.Badge">{{tile.Badge}}</span>
			</div>
		</div>
	</section>
</div>

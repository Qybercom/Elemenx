<div class="elemenx-find" role="search" [attribute.aria-label]="Label || $T('ui.find.label')" (keydown)="Key">
	<div class="elemenx-find-row">
		<Button *if="CanReplace" Variant="ghost" Size="small" [icon]="Replacing ? 'chevron-down' : 'chevron-right'" [expanded]="!!Replacing" [title]="$T('ui.find.toggleReplace')" (click)="Switch" />
		<input class="elemenx-find-query" type="text" spellcheck="false" autocomplete="off" [value]="Query" [placeholder]="$T('ui.find.placeholder')" [attribute.aria-label]="$T('ui.find.placeholder')" (input)="Typed" />
		<span class="elemenx-find-option" data-option="Case"><Button Variant="ghost" Size="small" [pressed]="!!Case" [ariaLabel]="$T('ui.find.case')" [title]="$T('ui.find.case')" (click)="Toggled">Aa</Button></span>
		<span class="elemenx-find-option" data-option="Word"><Button Variant="ghost" Size="small" [pressed]="!!Word" [ariaLabel]="$T('ui.find.word')" [title]="$T('ui.find.word')" (click)="Toggled"><u>ab</u></Button></span>
		<span class="elemenx-find-option" data-option="RegExp"><Button Variant="ghost" Size="small" [pressed]="!!RegExp" [ariaLabel]="$T('ui.find.regexp')" [title]="$T('ui.find.regexp')" (click)="Toggled">.*</Button></span>
		<span class="elemenx-find-count" role="status">{{Query ? (Count ? $T('ui.find.count', {index: Index + 1, count: Count}) : $T('ui.find.none')) : ''}}</span>
		<Button Variant="ghost" Size="small" Icon="arrow-up" [title]="$T('ui.find.previous')" [disabled]="!Count" (click)="Previous" />
		<Button Variant="ghost" Size="small" Icon="arrow-down" [title]="$T('ui.find.next')" [disabled]="!Count" (click)="Next" />
		<Button Variant="ghost" Size="small" Icon="close" [title]="$T('ui.find.close')" (click)="Close" />
	</div>
	<div class="elemenx-find-row" *if="CanReplace && Replacing">
		<span class="elemenx-find-indent"></span>
		<input class="elemenx-find-replacement" type="text" spellcheck="false" autocomplete="off" [value]="Replacement" [placeholder]="$T('ui.find.replacement')" [attribute.aria-label]="$T('ui.find.replacement')" (input)="Written" />
		<Button Size="small" [label]="$T('ui.find.replace')" [disabled]="!Count" (click)="Replace" />
		<Button Size="small" [label]="$T('ui.find.replaceAll')" [disabled]="!Count" (click)="ReplaceAll" />
	</div>
</div>

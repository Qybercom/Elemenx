<nav class="elemenx-game-panel elemenx-game-menu" [attribute.aria-label]="Title || $T('gaming.ui.menu')" (keydown)="Key">
	<h2 class="elemenx-game-menu-title" *if="Title">{{Title}}</h2>
	<p class="elemenx-game-menu-subtitle" *if="Subtitle">{{Subtitle}}</p>
	<div class="elemenx-game-menu-items">
		<Button class="elemenx-game-menu-item" *for="item of Items" *key="item.ID" Variant="ghost" Block="true" [Icon]="item.Icon || ''" [Disabled]="!!item.Disabled" (click)="Chosen(item)">
			<span class="elemenx-game-menu-label">{{item.Label}}</span>
			<span class="elemenx-game-menu-hint" *if="item.Hint">{{item.Hint}}</span>
		</Button>
	</div>
	<slot></slot>
</nav>

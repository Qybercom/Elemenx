<div class="elemenx-drawing-layers" [class.readonly]="!Editable()">
	<div class="elemenx-drawing-layers-list" role="listbox" [attribute.aria-label]="$T('graphics.drawing.layers')">
		<div class="elemenx-drawing-layer elemenx-focus-ring" role="option" tabindex="0" *for="layer of Rows()" *key="layer.ID" [class.current]="layer.ID === Current()" [class.hidden]="layer.Visible === false" [attribute.aria-selected]="layer.ID === Current() ? 'true' : 'false'" [attribute.data-layer]="layer.ID" (click)="Picked" (dblclick)="Rename" (keydown)="Key">
			<Button class="elemenx-drawing-layer-toggle" Variant="ghost" Size="small" [Disabled]="!Editable()" [Pressed]="layer.Visible !== false" [Title]="$T('graphics.drawing.visible')" [Icon]="layer.Visible === false ? 'eye-off' : 'eye'" (click)="Shown($event)" />
			<Button class="elemenx-drawing-layer-toggle" Variant="ghost" Size="small" [Disabled]="!Editable()" [Pressed]="!!layer.Locked" [Title]="$T('graphics.drawing.locked')" [Icon]="layer.Locked ? 'lock' : 'unlock'" (click)="Locked($event)" />
			<span class="elemenx-drawing-layer-field" *if="Renaming === layer.ID" (keydown)="Typed"><Input Size="small" [Label]="$T('graphics.drawing.rename')" [Value]="layer.Name" (change)="Named($event)" /></span>
			<span class="elemenx-drawing-layer-name elemenx-ellipsis" *if="Renaming !== layer.ID">{{layer.Name}}</span>
			<span class="elemenx-drawing-layer-count">{{Count(layer.Items)}}</span>
		</div>
	</div>
	<div class="elemenx-drawing-layers-actions" *if="Editable()">
		<Button Variant="ghost" Size="small" Icon="add" [title]="$T('graphics.drawing.addLayer')" (click)="Added" />
		<Button Variant="ghost" Size="small" Icon="arrow-up" [title]="$T('graphics.drawing.raise')" (click)="Raised" />
		<Button Variant="ghost" Size="small" Icon="arrow-down" [title]="$T('graphics.drawing.lower')" (click)="Lowered" />
		<Button Variant="ghost" Size="small" Icon="delete" [title]="$T('graphics.drawing.removeLayer')" [disabled]="Rows().length < 2" (click)="Removed" />
	</div>
</div>

<div class="elemenx-texture-lab">
	<div class="elemenx-texture-lab-view" #View role="img" [attribute.aria-label]="Label || $T('graphics.textureLab.label')">
		<canvas class="elemenx-texture-lab-canvas" #Canvas></canvas>
	</div>
	<aside class="elemenx-texture-lab-panel">
		<div class="elemenx-texture-lab-field"><span>{{$T('graphics.textureLab.texture')}}</span>
			<Select [Label]="$T('graphics.textureLab.texture')" [Options]="NameOptions(Version)" [Value]="Texture" (change)="Picked($event)" />
		</div>
		<div class="elemenx-texture-lab-field"><span>{{$T('graphics.textureLab.view')}}</span>
			<Select [Label]="$T('graphics.textureLab.view')" [Options]="ViewOptions(Version)" [Value]="View" (change)="Viewed($event)" />
		</div>
		<div class="elemenx-texture-lab-field"><span>{{$T('graphics.textureLab.mode')}}</span>
			<Select [Label]="$T('graphics.textureLab.mode')" [Options]="ModeOptions(Version)" [Value]="Mode" (change)="Moded($event)" />
		</div>
		<div class="elemenx-texture-lab-title">{{$T('graphics.textureLab.params')}}</div>
		<div class="elemenx-texture-lab-field" *for="slider of Sliders(Version, Texture, Params)" *key="Texture + slider.Key"><span>{{slider.Title}}</span>
			<Slider [Label]="slider.Title" [Min]="slider.Min" [Max]="slider.Max" [Step]="slider.Step" [Value]="slider.Value" (input)="Slid(slider.Key, $event)" />
		</div>
		<div class="elemenx-texture-lab-title">{{$T('graphics.textureLab.light')}}</div>
		<div class="elemenx-texture-lab-field"><span>{{$T('graphics.textureLab.sun')}}</span><Slider [Label]="$T('graphics.textureLab.sun')" [Min]="2" [Max]="90" [Step]="1" [Value]="Sun" (input)="Sunned('Sun', $event)" /></div>
		<div class="elemenx-texture-lab-field"><span>{{$T('graphics.textureLab.turn')}}</span><Slider [Label]="$T('graphics.textureLab.turn')" [Min]="0" [Max]="360" [Step]="1" [Value]="Turn" (input)="Sunned('Turn', $event)" /></div>
		<div class="elemenx-texture-lab-field"><span>{{$T('graphics.textureLab.height')}}</span><Slider [Label]="$T('graphics.textureLab.height')" [Min]="0.2" [Max]="20" [Step]="0.1" [Value]="Height" (input)="Sunned('Height', $event)" /></div>
		<div class="elemenx-texture-lab-field"><span>{{$T('graphics.textureLab.pitch')}}</span><Slider [Label]="$T('graphics.textureLab.pitch')" [Min]="5" [Max]="90" [Step]="1" [Value]="Pitch" (input)="Sunned('Pitch', $event)" /></div>
	</aside>
</div>

<div class="elemenx-scene-editor" [class.playing]="Playing">
	<div class="elemenx-scene-editor-toolbar" role="toolbar" [attribute.aria-label]="$T('graphics.sceneEditor.tools')">
		<div class="elemenx-scene-editor-group">
			<button type="button" class="elemenx-scene-editor-tool" *for="tool of ToolsOf(Version)" *key="tool.ID" [class.active]="Tool === tool.ID" [attribute.data-tool]="tool.ID" [attribute.title]="$T(tool.Key) + ' (' + tool.Hotkey + ')'" [attribute.aria-pressed]="Tool === tool.ID ? 'true' : 'false'" [disabled]="Playing" (click)="Pick(tool.ID)"><Icon [name]="tool.Icon" Size="16" /></button>
			<select class="elemenx-scene-editor-sketch-type" *if="Tool === 'sketch'" [attribute.aria-label]="$T('graphics.sceneEditor.sketchType')" (change)="SketchPicked">
				<optgroup *for="group of SketchGroups" *key="group.Kind" [attribute.label]="$T(group.Key)">
					<option *for="type of group.Types" *key="type" [value]="type" [selected]="type === SketchType">{{type}}</option>
				</optgroup>
			</select>
			<select class="elemenx-scene-editor-sketch-type" *if="Tool === 'road'" [attribute.aria-label]="$T('graphics.sceneEditor.roadType')" (change)="RoadTyped">
				<option *for="type of RoadTypesOf(Version)" *key="type" [value]="type" [selected]="type === RoadType">{{type}}</option>
			</select>
			<select class="elemenx-scene-editor-sketch-type" *if="Tool === 'road'" [attribute.aria-label]="$T('graphics.sceneEditor.roadPart')" (change)="RoadParted">
				<option *for="part of RoadParts" *key="part.ID" [value]="part.ID" [selected]="part.ID === RoadPart">{{$T(part.Key)}}</option>
			</select>
			<label class="elemenx-scene-editor-snap" *if="Tool === 'road'" [attribute.title]="$T('graphics.sceneEditor.roadRadius')">{{$T('graphics.sceneEditor.roadRadius')}}<input type="number" min="0" step="1" [value]="RoadRadius" (change)="RoadRadiused" /></label>
			<label class="elemenx-scene-editor-snap" [attribute.title]="$T('graphics.sceneEditor.snap')"><input type="checkbox" [checked]="Snap" [disabled]="Playing" (change)="Snapped" />{{$T('graphics.sceneEditor.snap')}}</label>
			<label class="elemenx-scene-editor-time" *if="Space(Version)" [attribute.title]="$T('graphics.sceneEditor.day')">{{$T('graphics.sceneEditor.day')}}<input type="number" step="1" [value]="Day(Version)" [disabled]="Playing" (change)="Timed" /></label>
		</div>
		<div class="elemenx-scene-editor-group">
			<Button Size="small" Variant="ghost" Icon="undo" [title]="$T('graphics.sceneEditor.undo')" [disabled]="Playing || !Past" (click)="Undo" />
			<Button Size="small" Variant="ghost" Icon="redo" [title]="$T('graphics.sceneEditor.redo')" [disabled]="Playing || !Future" (click)="Redo" />
		</div>
		<div class="elemenx-scene-editor-group">
			<Button Size="small" [variant]="Playing ? 'danger' : 'primary'" [icon]="Playing ? 'stop' : 'play'" [label]="Playing ? $T('graphics.sceneEditor.stop') : $T('graphics.sceneEditor.play')" (click)="Toggled" />
		</div>
		<div class="elemenx-scene-editor-group end">
			<Button Size="small" Variant="ghost" Icon="save" [title]="$T('graphics.sceneEditor.save')" [disabled]="Playing" (click)="Store" />
			<Button Size="small" Variant="ghost" Icon="download" [title]="$T('graphics.sceneEditor.export')" [disabled]="Playing" (click)="Exported" />
			<label class="elemenx-scene-editor-import" [attribute.title]="$T('graphics.sceneEditor.import')"><Icon name="upload" Size="16" /><input type="file" accept="application/json,.json" [disabled]="Playing" (change)="Imported" /></label>
		</div>
	</div>
	<aside class="elemenx-scene-editor-side" *if="!Playing">
		<div class="elemenx-scene-editor-title">{{$T('graphics.sceneEditor.objects')}}</div>
		<Tree [items]="Items(Version)" [value]="Selected" [label]="$T('graphics.sceneEditor.objects')" (select)="Chosen" />
		<div class="elemenx-scene-editor-layers" *if="Tool === 'sketch'">
			<div class="elemenx-scene-editor-title">{{$T('graphics.sceneEditor.layers')}}<Button Size="small" Variant="ghost" Icon="plus" [title]="$T('graphics.sceneEditor.addLayer')" (click)="AddLayer" /></div>
			<div class="elemenx-scene-editor-layer" *for="layer of Layers(Version)" *key="layer.ID" [class.current]="layer.ID === SketchLayer">
				<button type="button" class="elemenx-scene-editor-layer-name" (click)="LayerPicked(layer.ID)">{{layer.Name || layer.ID}}</button>
				<button type="button" class="elemenx-scene-editor-layer-eye" [attribute.title]="$T('graphics.sceneEditor.visible')" (click)="LayerShown(layer.ID)"><Icon [name]="layer.Visible === false ? 'eye-off' : 'eye'" Size="14" /></button>
			</div>
		</div>
		<div class="elemenx-scene-editor-title">{{$T('graphics.sceneEditor.add')}}</div>
		<div class="elemenx-scene-editor-palette">
			<button type="button" class="elemenx-scene-editor-kind" *for="kind of Palette(Version)" *key="kind" [attribute.data-kind]="kind" (click)="Placed(kind)">{{kind}}</button>
			<button type="button" class="elemenx-scene-editor-kind model" *for="name of Placeable(Version)" *key="name" [attribute.data-model]="name" (click)="PlacedModel(name)">{{name}}</button>
		</div>
	</aside>
	<div class="elemenx-scene-editor-view" #View>
		<Scene #Scene Setting="ground" Paused="true" Labels="false" Details="false" Quality="medium" [loader]="true" (ready)="SceneReady" (shader)="ShaderTold" />
		<div class="elemenx-scene-editor-overlay" #Overlay tabindex="0" *if="!Playing" [attribute.aria-label]="Label || $T('graphics.sceneEditor.label')" (pointerdown)="Down" (pointermove)="Move" (pointerup)="Up" (pointercancel)="Up" (wheel)="Wheeled" (contextmenu)="Menu" (keydown)="Key" (keyup)="KeyUp" (blur)="Blurred">
			<svg class="elemenx-scene-editor-gizmo" #Gizmo></svg>
		</div>
	</div>
	<aside class="elemenx-scene-editor-inspector" *if="!Playing">
		<div class="elemenx-scene-editor-title">{{Selected || $T('graphics.sceneEditor.nothing')}}</div>
		<div class="elemenx-scene-editor-fields" #Fields></div>
		<div class="elemenx-scene-editor-title" *if="Tool === 'sketch'">{{$T('graphics.sceneEditor.sketch')}}</div>
		<div class="elemenx-scene-editor-fields" #Items></div>
		<div class="elemenx-scene-editor-title" *if="Exposed(Version).length">{{$T('graphics.sceneEditor.parameters')}}</div>
		<div class="elemenx-scene-editor-parameter" *for="parameter of Exposed(Version)" *key="parameter.key">
			<label>{{parameter.key}}<input type="text" [value]="parameter.Shown" [attribute.data-parameter]="parameter.key" (change)="Tuned" /></label>
		</div>
	</aside>
	<div class="elemenx-scene-editor-blueprint" *if="!Playing && Graph(Version)">
		<Blueprint [value]="Graph(Version)" [errors]="GraphErrors(Version, Told)" (change)="Drawn" />
	</div>
</div>

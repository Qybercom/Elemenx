<div class="elemenx-scene" tabindex="0" role="application" [class.dragging]="Dragging" [attribute.data-setting]="Setting || 'space'" [attribute.aria-label]="Label || $T('graphics.scene.label')" [attribute.data-changed]="Changed(System, Seed, Time, Speed, Paused, Focus, Selected, Orbits, Labels, Scale, Background, Team, Setting, Map, Fog, Grid, Projection, X, Y, Zoom)" (keydown)="Key" (keyup)="KeyUp" (blur)="Blurred">
	<canvas class="elemenx-scene-canvas" (pointerdown)="PointerDown" (pointermove)="PointerMove" (pointerup)="PointerUp" (pointercancel)="PointerCancel" (wheel)="Wheel" (dblclick)="Double" (contextmenu)="Menu"></canvas>
	<div class="elemenx-scene-labels" [class.hidden]="!Labels || Labels === 'false'" (click)="LabelPressed" (dblclick)="LabelDouble"></div>
	<div class="elemenx-scene-axes-place" *if="Axes" [attribute.data-corner]="Axes === true || Axes === 'true' ? 'top-right' : Axes"><SceneAxes [yaw]="ViewYaw" [pitch]="ViewPitch" (axis)="AxisChosen" /></div>
	<div class="elemenx-scene-fallback" *if="Unsupported">{{$T('graphics.scene.unsupported')}}</div>
	<aside class="elemenx-scene-card" *if="Card && Details && Details !== 'false'" [attribute.aria-label]="Card.Name">
		<header class="elemenx-scene-card-header">
			<span class="elemenx-scene-card-title"><strong class="elemenx-ellipsis">{{Card.Name}}</strong><span class="elemenx-scene-card-kind">{{Card.Kind}}</span></span>
			<Button Variant="ghost" Size="small" Icon="close" [title]="$T('graphics.scene.close')" (click)="Unselect" />
		</header>
		<dl class="elemenx-scene-card-rows">
			<div class="elemenx-scene-card-row" *for="row of Card.Rows" *key="row.Key"><dt>{{row.Label}}</dt><dd>{{row.Value}}</dd></div>
		</dl>
		<span class="elemenx-scene-card-actions">
			<Button Size="small" Icon="zoom-in" [label]="$T('graphics.scene.focus')" (click)="FocusSelected" />
			<Button Size="small" Icon="arrow-down" *if="Card.Land" [label]="$T('graphics.scene.land')" (click)="LandSelected" />
		</span>
	</aside>
	<Button class="elemenx-scene-takeoff" Size="small" Icon="arrow-up" *if="LandedOn" [label]="$T('graphics.scene.takeOff')" (click)="TakeOff" />
	<div class="elemenx-scene-veil" *if="Veiled" [style.opacity]="Veiled" aria-hidden="true"></div>
	<div class="elemenx-scene-landing" *if="ShipCan || ShipOrbit">
		<Button Size="small" Icon="arrow-down" *if="ShipCan === 'land'" [label]="$T('graphics.scene.landing')" [attribute.aria-expanded]="LandingOpen ? 'true' : 'false'" (click)="LandingOpened" />
		<Button Size="small" Icon="arrow-up" *if="ShipCan === 'takeoff'" [label]="$T('graphics.scene.takeOff')" (click)="ShipTakeOff" />
		<Button Size="small" Icon="refresh" *if="ShipOrbit" [label]="$T('graphics.scene.toOrbit')" (click)="ShipToOrbit" />
		<span class="elemenx-scene-landing-hint" *if="ShipHint === 'orbit'">{{$T('graphics.scene.orbitHint')}}</span>
		<div class="elemenx-scene-landing-list" *if="LandingOpen" role="menu">
			<button type="button" role="menuitem" class="elemenx-scene-landing-item" *for="marker of LandingMarkers" *key="marker.ID" [attribute.data-marker]="marker.ID" (click)="MarkerPicked(marker.ID)">{{marker.Name}}<span class="elemenx-scene-landing-time" *if="marker.Day">{{$T('graphics.scene.day')}}</span><span class="elemenx-scene-landing-time" *if="!marker.Day">{{$T('graphics.scene.night')}}</span></button>
			<button type="button" role="menuitem" class="elemenx-scene-landing-item pick" (click)="PointPicking">{{$T('graphics.scene.pickPoint')}}</button>
		</div>
	</div>
	<div class="elemenx-scene-loading" [hidden]="Loading === null || !Loader || Loader === 'false'"><slot name="loading"></slot><Progress *if="!LoadingOwn" Size="small" [value]="LoadingEndless ? null : Loading" [label]="$T('graphics.scene.loading') + (LoadingText ? ' · ' + LoadingText : '')" /></div>
	<div class="elemenx-scene-hud"><slot name="hud"></slot></div>
	<div class="elemenx-scene-sources" hidden><slot></slot></div>
	<div class="elemenx-scene-screens" aria-hidden="true"><slot name="screens"></slot></div>
	<div class="elemenx-visually-hidden" aria-live="polite">{{Status}}</div>
</div>
